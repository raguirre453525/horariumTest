              - heading "Core APIs and capabilities" [level=2] [ref=f4e353]
              - button [ref=f4e354] [cursor=pointer]
            - generic [ref=f4e360]:
              - heading "WhatsApp Business Platform Cloud API" [level=3] [ref=f4e361]
              - button [ref=f4e362] [cursor=pointer]
            - generic [ref=f4e366]: The WhatsApp Business Platform Cloud API enables you to programmatically message and call on WhatsApp. You can use Cloud API to send users a variety of messages, from simple text messages to rich media and interactive messages.
            - generic [ref=f4e367]: "Cloud API includes:"
            - list [ref=f4e368]:
              - listitem [ref=f4e370]:
                - strong [ref=f4e371]: "Messaging:"
                - text: Send text messages, rich media, and interactive messages
              - listitem [ref=f4e373]:
                - strong [ref=f4e374]: "Calling:"
                - text: Make and receive calls to customers
              - listitem [ref=f4e376]:
                - strong [ref=f4e377]: "Groups:"
                - text: Create, manage, and message WhatsApp group conversations
            - generic [ref=f4e378]: "WhatsApp messaging lets you send encrypted messages to customers. Use Cloud API to:"
            - list [ref=f4e379]:
              - listitem [ref=f4e381]: Send order confirmations and shipping updates
              - listitem [ref=f4e383]: Share appointment availability and other reminders
              - listitem [ref=f4e385]: Send messages that recommend related or additional products
              - listitem [ref=f4e387]: Facilitate end-to-end transactions, from product discovery to payment
              - listitem [ref=f4e389]: Enable multi-factor authentication or one-time passwords to verify accounts and users
              - listitem [ref=f4e391]: Deliver custom interactive conversational experiences
            - link "Learn more about message types on Cloud API." [ref=f4e393] [cursor=pointer]:
              - /url: /documentation/business-messaging/whatsapp/messages/send-messages
            - generic [ref=f4e396]:
              - heading "WhatsApp Business Platform Business Management API" [level=3] [ref=f4e397]
              - button [ref=f4e398] [cursor=pointer]
            - generic [ref=f4e402]: The WhatsApp Business Management API enables you to programmatically manage a WhatsApp Business account and its associated assets.
            - generic [ref=f4e403]: "Manage account assets with Business Management API like:"
            - list [ref=f4e404]:
              - listitem [ref=f4e406]:
                - strong [ref=f4e407]: "Business phone numbers:"
                - text: Add and remove phone numbers associated with your business.
              - listitem [ref=f4e409]:
                - strong [ref=f4e410]: "Templates:"
                - text: Create and modify message templates for scalable messaging.
            - generic [ref=f4e411]: "Business Management API also gives you access to account analytics like:"
            - list [ref=f4e412]:
              - listitem [ref=f4e414]:
                - strong [ref=f4e415]: "Messaging analytics:"
                - text: The number and type of messages sent and delivered.
              - listitem [ref=f4e417]:
                - strong [ref=f4e418]: "Pricing analytics:"
                - text: Granular pricing breakdowns for delivered messages.
              - listitem [ref=f4e420]:
                - generic [ref=f4e421]:
                  - strong [ref=f4e422]: "Template analytics:"
                  - text: Sent/read/delivered template metrics, alongside template message button clicks.
              - listitem [ref=f4e424]:
                - link "Learn more about message templates." [ref=f4e425] [cursor=pointer]:
                  - /url: /documentation/business-messaging/whatsapp/templates/overview
              - listitem [ref=f4e427]:
                - link "Learn more about managing business phone numbers." [ref=f4e428] [cursor=pointer]:
                  - /url: /documentation/business-messaging/whatsapp/business-phone-numbers/phone-numbers
              - listitem [ref=f4e430]:
                - link "Learn more about account analytics." [ref=f4e431] [cursor=pointer]:
                  - /url: /documentation/business-messaging/whatsapp/analytics
            - generic [ref=f4e434]:
              - heading "Marketing Messages API for WhatsApp" [level=3] [ref=f4e435]
              - button [ref=f4e436] [cursor=pointer]
            - generic [ref=f4e440]: MM API for WhatsApp is an API for sending optimized marketing messages on WhatsApp.
            - generic [ref=f4e441]: When you send marketing messages through the MM API for WhatsApp, you can access new features not available on Cloud API and get automatic optimizations, so high engagement messages can reach more customers.
            - generic [ref=f4e442]: "The MM API for WhatsApp includes:"
            - list [ref=f4e443]:
              - listitem [ref=f4e445]:
                - strong [ref=f4e446]: "Quality-based delivery:"
                - text: Up to 9% higher marketing message deliveries over Cloud API for high engagement content.
              - listitem [ref=f4e448]:
                - strong [ref=f4e449]: "Automated creative optimizations:"
                - text: Automatic enhancements to marketing creative to increase message performance.
              - listitem [ref=f4e451]:
                - strong [ref=f4e452]: "Performance benchmarks and recommendations:"
                - text: Comparison of read and click rates versus similar templates from businesses in your region.
              - listitem [ref=f4e454]:
                - strong [ref=f4e455]: "Conversion metrics:"
                - text: Measure marketing messages that lead users to perform app events such as ‘Add to Cart’, ‘Checkout Initiated’, or ‘Purchase’.
            - link "Learn more about the Marketing Messages API for WhatsApp." [ref=f4e457] [cursor=pointer]:
              - /url: /documentation/business-messaging/whatsapp/marketing-messages/overview
            - generic [ref=f4e460]:
              - heading "Webhooks" [level=3] [ref=f4e461]
              - button [ref=f4e462] [cursor=pointer]
            - generic [ref=f4e466]: Webhooks deliver JSON payloads to your server for message status updates, incoming messages, asynchronous error handling, and many other notification utilities.
            - generic [ref=f4e467]: The platform relies heavily on webhooks, as the contents of any message sent from a WhatsApp user to your business phone number is communicated via webhook, and all outgoing message delivery status updates are reported via webhook.
            - generic [ref=f4e468]:
              - link "Learn more about webhooks" [ref=f4e469] [cursor=pointer]:
                - /url: /documentation/business-messaging/whatsapp/webhooks/overview
              - text: .
            - generic [ref=f4e472]:
              - heading "Meta Business Agent" [level=3] [ref=f4e473]
              - button [ref=f4e474] [cursor=pointer]
            - generic [ref=f4e478]: Meta Business Agent lets you configure and operate AI-powered agents on WhatsApp. Agents handle conversations with WhatsApp users autonomously, using knowledge sources you provide (FAQs, business info, product catalogs, files, and websites) and custom connectors to your external APIs.
            - generic [ref=f4e479]: "Meta Business Agent includes:"
            - list [ref=f4e480]:
              - listitem [ref=f4e482]:
                - strong [ref=f4e483]: "Agent configuration:"
                - text: Set agent behavior, persona, language, and system instructions
              - listitem [ref=f4e485]:
                - strong [ref=f4e486]: "Knowledge management:"
                - text: Connect FAQs, business info, catalogs, files, and websites for the agent to reference
              - listitem [ref=f4e488]:
                - strong [ref=f4e489]: "Custom connectors:"
                - text: Integrate your external APIs so the agent can take actions like checking order status or booking appointments
              - listitem [ref=f4e491]:
                - strong [ref=f4e492]: "Thread control:"
                - text: Manage handoffs between the AI agent and human agents
              - listitem [ref=f4e494]:
                - strong [ref=f4e495]: "Evaluation and testing:"
                - text: Test agent responses and evaluate performance
            - generic [ref=f4e496]:
