            - generic [ref=f4e915]:
              - text: Business phone numbers can send 1 message every 6 seconds to the same WhatsApp user (0.17 messages/second), which equals about 10 messages per minute or 600 per hour. Exceeding this limit triggers
              - link "error code 131056" [ref=f4e916] [cursor=pointer]:
                - /url: /documentation/business-messaging/whatsapp/support/error-codes#throttling-errors
              - text: until you are back within the allowed rate.
            - generic [ref=f4e917]: You may send up to 45 messages in a 6-second burst, but this “borrows” from your future quota. After a burst, you must wait the equivalent time it would take to send those messages at the normal rate (for example, a burst of 20 requires a ~2-minute wait before sending more to that user).
            - generic [ref=f4e918]: To manage post-burst throttling, if a send request fails, retry after 4^X seconds (starting with X=0 and increasing X by 1 after each failure) until successful.
