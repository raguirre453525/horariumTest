              - button [ref=f4e747] [cursor=pointer]
            - generic [ref=f4e751]: With Cloud API, every WhatsApp message continues to be protected by Signal protocol encryption that secures messages before they leave the device. Signal protocol encryption ensures that messages with a WhatsApp Business account are securely delivered to the destination chosen by each business.
            - generic [ref=f4e752]: Cloud API uses industry standard encryption techniques to protect data in transit and at rest. Cloud API uses Graph API for sending messages and Webhooks for receiving events, and both operate over industry standard HTTPS, protected by TLS.
