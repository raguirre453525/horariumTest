          - heading "Crea una cuenta de WhatsApp Business en la plataforma de WhatsApp Business como socio de soluciones" [level=1] [ref=f19e66]
          - generic [ref=f19e71]:
            - generic [ref=f19e73]:
              - generic [ref=f19e77]:
                - text: Este artículo está dirigido a socios de soluciones de la plataforma de WhatsApp Business. Obtén información sobre las
                - link "diferencias entre la Plataforma de WhatsApp Business y la app de WhatsApp Business" [ref=f19e78] [cursor=pointer]:
                  - /url: https://www.facebook.com/business/help/338665938087159
                - text: .
              - paragraph [ref=f19e83]:
                - text: Explora nuestra
                - link "librería de contenido de ayuda" [ref=f19e84] [cursor=pointer]:
                  - /url: https://developers.facebook.com/docs/whatsapp/finding-information
                - text: para encontrar respuestas y solucionar problemas.
              - paragraph [ref=f19e86]:
                - text: Puedes crear una cuenta de WhatsApp Business como socio de soluciones y, luego,
                - link "realizar más pasos" [ref=f19e87] [cursor=pointer]:
                  - /url: https://developers.facebook.com/documentation/business-messaging/whatsapp/get-started
                - text: para ofrecerles a tus clientes la API de la nube de la Plataforma de WhatsApp Business, alojada por Meta. Sigue los pasos a continuación para aprender a crear una cuenta de WhatsApp Business en la Plataforma de WhatsApp Business como socio de soluciones.
              - generic [ref=f19e88]:
                - heading "Antes de empezar" [level=2] [ref=f19e90]
                - list [ref=f19e91]:
                  - listitem [ref=f19e92]:
                    - generic [ref=f19e93]: Los pasos de este artículo están dirigidos a ti si eres un socio de soluciones y quieres crear una cuenta de WhatsApp Business para ti, o bien si quieres enviar mensajes en nombre de un cliente final.
                  - listitem [ref=f19e94]:
                    - generic [ref=f19e95]:
                      - text: Tendrás que
                      - link "registrarte para acceder a un portfolio comercial" [ref=f19e96] [cursor=pointer]:
                        - /url: https://www.facebook.com/help/1710077379203657?helpref=faq_content
                      - text: .
                  - listitem [ref=f19e97]:
                    - generic [ref=f19e98]: Necesitas tener el control total del portfolio comercial.
                  - listitem [ref=f19e99]:
                    - generic [ref=f19e100]: Si creas una cuenta en nombre de un negocio, este debe aceptar tu solicitud y asegurarse de que su perfil comercial en el portfolio comercial esté completo.
                  - listitem [ref=f19e101]:
                    - generic [ref=f19e102]:
                      - text: Si un socio de soluciones usa la integración técnica de la plataforma de WhatsApp Business para brindar asistencia a tu negocio, usa el proceso de
                      - link "registro insertado" [ref=f19e103] [cursor=pointer]:
                        - /url: https://www.facebook.com/business/help/524220081677109
                      - text: para crear tu cuenta de WhatsApp Business.
                  - listitem [ref=f19e104]:
                    - generic [ref=f19e105]:
                      - text: Si piensas desarrollar para ti o para tu organización (no para un cliente), visita la
                      - link "documentación para desarrolladores de WhatsApp" [ref=f19e106] [cursor=pointer]:
                        - /url: https://developers.facebook.com/docs/whatsapp/cloud-api/get-started
                      - text: a fin de crear tu cuenta de WhatsApp Business.
                  - listitem [ref=f19e107]:
                    - generic [ref=f19e108]:
                      - text: Si tu negocio usa la app de WhatsApp Business, crea una cuenta de WhatsApp Business en la
                      - link "app de WhatsApp Business" [ref=f19e109] [cursor=pointer]:
                        - /url: https://l.facebook.com/l.php?u=https%3A%2F%2Fwww.whatsapp.com%2Fcoronavirus%2Fget-started-business&h=AUBeiLBvEgwOUfK05TjTp_gdtuj28ja0quVrc9W6V01VwfcQdf1rYxr6TUy6cyzqFi2CjjCm9Ye09GJwRH2evw76pwJj6yDAOAu1BB-Kv1_2ci-63em5GKZATJtO82xHvREl_Uk-UL5un5g0LFbm3w
                      - text: .
              - generic [ref=f19e110]:
                - heading "Crear una cuenta de WhatsApp Business" [level=2] [ref=f19e112]
                - paragraph [ref=f19e113]:
                  - text: Para empezar, ve a
                  - link "Configuración" [ref=f19e114] [cursor=pointer]:
                    - /url: https://business.facebook.com/latest/settings/
                  - text: en Meta Business Suite.
                - list [ref=f19e115]:
                  - listitem [ref=f19e116]: En el menú despegable de la parte superior izquierda, selecciona el portfolio comercial para el que quieres crear una cuenta de WhatsApp Business.
                  - listitem [ref=f19e117]: Haz clic en "Cuentas de WhatsApp" en la sección Cuentas.
                  - listitem [ref=f19e118]: Haz clic en Agregar cuenta de WhatsApp si esta es la primera cuenta de WhatsApp Business que quieres crear o conectar a este portfolio comercial. De lo contrario, haz clic en Agregar.
                  - listitem [ref=f19e119]: Ingresa el número de teléfono asociado.
                  - listitem [ref=f19e120]:
                    - text: "En la sección de Crear cuenta de WhatsApp:"
                    - list [ref=f19e121]:
                      - listitem [ref=f19e122]: "Nombre de la cuenta: escribe el nombre de tu cuenta de WhatsApp Business."
                      - listitem [ref=f19e123]:
                        - text: "Mensajes para: selecciona si estás creando la cuenta para ti o para un cliente en el menú desplegable en los siguientes casos."
                        - list [ref=f19e124]:
                          - listitem [ref=f19e125]:
                            - generic [ref=f19e126]: Tu propio portfolio comercial.
                          - listitem [ref=f19e127]:
                            - generic [ref=f19e128]: La cuenta de tu cliente para crear una cuenta en nombre de un negocio. Si debes ingresar el identificador del portfolio comercial del cliente, puedes buscarlo en la pestaña Información del negocio en la Configuración.
                      - listitem [ref=f19e129]: "Zona horaria: selecciona la zona horaria donde se encuentra tu negocio."
                      - listitem [ref=f19e130]: "Divisa local: selecciona la divisa local del negocio. La divisa que selecciones debe coincidir con la que utilizarás para pagar tu nota de pago pendiente."
                      - listitem [ref=f19e131]:
                        - text: "Método de pago (opcional): selecciona un método de pago para los anuncios. Si no tienes una línea de crédito vigente para los pagos, puedes"
                        - link "configurar una" [ref=f19e132] [cursor=pointer]:
                          - /url: https://www.facebook.com/business/help/1684730811624773?helpref=faq_content
                        - text: .
                      - listitem [ref=f19e133]: "N.º orden de compra (opcional): ingresa el número de orden de compra que aparecerá en tus notas de pago pendiente."
                      - listitem [ref=f19e134]: Haz clic en Listo.
                  - listitem [ref=f19e135]:
                    - text: "En la sección Agregar personas y establecer permisos:"
                    - list [ref=f19e136]:
                      - listitem [ref=f19e137]: Busca a las personas que quieras agregar a la cuenta y elige sus nombres de la lista.
                      - listitem [ref=f19e138]:
                        - text: "Selecciona el nivel de permisos que quieres asignar a cada persona. Puedes seleccionar:"
                        - list [ref=f19e139]:
                          - listitem [ref=f19e140]:
                            - generic [ref=f19e141]: Acceso parcial si quieres permitir que las personas administren números de teléfono y plantillas de mensajes.
                          - listitem [ref=f19e142]:
                            - generic [ref=f19e143]: Control total si quieres permitir que las personas administren la cuenta de WhatsApp.
                  - listitem [ref=f19e144]: Haz clic en Asignar.
                - paragraph
                - paragraph [ref=f19e145]:
                  - text: Una vez creada tu cuenta de WhatsApp Business, nuestro equipo la revisará. Te notificaremos si hay un problema. Puedes verificar el estado de tu cuenta en la
                  - link "página de configuración" [ref=f19e146] [cursor=pointer]:
                    - /url: https://business.facebook.com/settings/whatsapp-business-accounts/830549740997303?business_id=696636657357749&tab=whatsapp_settings
                  - text: en cualquier momento.
                - paragraph
                - paragraph [ref=f19e147]:
                  - text: "Nota: Debes"
                  - link "realizar pasos adicionales" [ref=f19e148] [cursor=pointer]:
                    - /url: https://developers.facebook.com/docs/whatsapp/cloud-api/get-started-for-bsps
                  - text: para ofrecer a los clientes la API de la nube de la Plataforma de WhatsApp Business.
                - generic [ref=f19e149]:
                  - paragraph [ref=f19e150]: Cuando envíes mensajes en nombre de un negocio, asegúrate de que el perfil del negocio esté completo para iniciar la incorporación de inmediato.
                  - paragraph
                  - paragraph [ref=f19e151]: Mientras el estado de la cuenta sea "Pendiente", podrás seguir accediendo al administrador de WhatsApp para administrarla. Una vez que el estado de tu cuenta esté aprobado, puedes empezar a agregar números de teléfono y enviar mensajes de inmediato. El estado de la cuenta debe ser "Aprobada" para que puedas descargar el certificado que te permite enviar y recibir mensajes.
                  - paragraph
                  - paragraph [ref=f19e152]:
                    - text: Si tu cliente quiere transferir la propiedad de esta cuenta de WhatsApp Business a su propio portfolio comercial, puedes enviarle
                    - link "estas instrucciones" [ref=f19e153] [cursor=pointer]:
                      - /url: https://www.facebook.com/business/help/782251187390267
                    - text: . Ten en cuenta que, por el momento, esta función solo está disponible para algunos negocios.
