              - rowgroup [ref=f82e452]:
                - row [ref=f82e453]:
                  - cell [ref=f82e454]:
                    - link "whatsapp_business_management" [ref=f82e457] [cursor=pointer]:
                      - /url: /docs/permissions#w
                  - cell "The whatsapp_business_management permission allows your app to read and/or manage WhatsApp business assets you own or have been granted access to by other businesses through this permission. These business assets include WhatsApp Business Accounts, business phone numbers, message templates, QR codes and their associated messages, and webhook subscriptions. If your app uses this permission to access WABAs not owned by your business, you must have Advanced access. Without it, API calls return error code 200." [ref=f82e458]:
                    - generic [ref=f82e459]:
                      - generic [ref=f82e460]: The whatsapp_business_management permission allows your app to read and/or manage WhatsApp business assets you own or have been granted access to by other businesses through this permission. These business assets include WhatsApp Business Accounts, business phone numbers, message templates, QR codes and their associated messages, and webhook subscriptions.
                      - generic [ref=f82e461]:
                        - text: If your app uses this permission to access WABAs not owned by your business, you must have
