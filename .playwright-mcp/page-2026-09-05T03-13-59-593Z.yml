            - generic [ref=f82e505]: The average turnaround time for App Review is about 24 hours. Start the App Review process as soon as possible. You don’t need to wait for Embedded Signup to be fully implemented to start this process.
            - generic [ref=f82e508]:
              - heading "Reducing chances of App Review rejection" [level=2] [ref=f82e509]
              - button [ref=f82e510] [cursor=pointer]
            - generic [ref=f82e514]:
              - text: You must request
              - strong [ref=f82e515]: Advanced access
              - text: for the permissions above.
            - generic [ref=f82e516]: You can request these permissions in a single bulk submission, or as separate submissions. For each permission, an explanation and screen recording specific to the permission being requested is required.
            - generic [ref=f82e517]: As part of your submission, you must include separate screen recordings that show how your app uses each permission in your submission. The video can be a screen recording directly from your computer, or a recording using a digital camera or camera phone. You will need to attach this file to your App Review submission.
            - generic [ref=f82e518]: Do not submit a video that includes multiple permissions supporting different use cases. You must submit a different video clip for each permission. Your submission may be rejected if you highlight multiple permissions being used as part of the same video.
            - generic [ref=f82e519]: Both written descriptions and screen recordings are required for each permission. If you include a screen recording that shows how your app uses a permission, but fail to include a description of how it uses it, your submission will be rejected.
