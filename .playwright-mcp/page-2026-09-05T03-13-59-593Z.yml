                      - generic [ref=f82e466]:
                        - strong [ref=f82e467]: "Written:"
                        - text: Explain how you will use this permission to access the business assets of clients who you have onboarded onto the platform.
                      - generic [ref=f82e468]:
                        - strong [ref=f82e469]: "Video:"
                        - text: Record a video of your app, or WhatsApp Manager, being used to create a message template.
                - row [ref=f82e470]:
                  - cell [ref=f82e471]:
                    - link "whatsapp_business_messaging" [ref=f82e474] [cursor=pointer]:
                      - /url: /docs/permissions#w
                  - cell "The whatsapp_business_messaging permission allows an app to send WhatsApp messages and make calls to a specific phone number, upload and retrieve media from messages, manage and get WhatsApp business profile information, and to register those phone numbers with Meta." [ref=f82e475]
