            - heading "WhatsApp app review" [level=1] [ref=f82e384]
            - generic [ref=f82e385]: "Updated: Jun 16, 2026"
            - generic [ref=f82e389]:
              - button "Copy for LLM" [ref=f82e391] [cursor=pointer]
              - link "View as Markdown" [ref=f82e398] [cursor=pointer]:
                - /url: /documentation/business-messaging/whatsapp/solution-providers/app-review.md
            - generic [ref=f82e404]:
              - text: App Review is part of
              - link "app development" [ref=f82e405] [cursor=pointer]:
                - /url: /docs/development
              - text: that enables us to verify that your app uses our Products and APIs in an approved manner. Meta needs to validate how you intend to use the requested permissions to make sure it is compliant with our requirements and policies.
            - generic [ref=f82e406]:
              - text: Businesses first need to develop a prototype of their product so they can demonstrate their use case with a video recording for the App Review submission. To pass App Review, it is important that you ask for only the permissions your app needs;
              - strong [ref=f82e407]: requesting unnecessary permissions is a common reason for rejection
              - text: during App Review.
            - generic [ref=f82e408]: "The following video provides a brief overview of the App Review process:"
            - group "Video player" [ref=f82e417]:
              - button "Play video" [ref=f82e421] [cursor=pointer]
            - generic [ref=f82e428]:
              - text: Business apps are automatically approved for
              - link "Standard Access" [ref=f82e429] [cursor=pointer]:
                - /url: /docs/graph-api/overview/access-levels#standard-access
              - text: for all Permissions and Features available to the Business app type, so you can test your app while you are in this access level. Make sure your test users have a
              - code [ref=f82e430]: developer
              - text: or
              - code [ref=f82e431]: admin
              - text: role in the Meta app being used to implement Embedded Signup. This means that if you are using the API for yourself as a Direct Developer, you do not need Advanced access or app review.
            - generic [ref=f82e433]:
              - text: If you are building an app that other businesses will be using, you must request Advanced access for any permissions your app needs. You can request
              - link "Advanced access" [ref=f82e434] [cursor=pointer]:
                - /url: /docs/graph-api/overview/access-levels#advanced-access
              - text: by submitting your app to App Review.
            - generic [ref=f82e437]:
              - heading "Permissions" [level=2] [ref=f82e438]
              - button [ref=f82e439] [cursor=pointer]
            - generic [ref=f82e443]:
              - text: Commonly requested permissions and what to include to get approval for
              - strong [ref=f82e444]: Advanced access
              - text: ":"
            - table [ref=f82e446]:
              - rowgroup [ref=f82e447]:
                - row [ref=f82e448]:
                  - columnheader "Permission" [ref=f82e449]
                  - columnheader "Description" [ref=f82e450]
