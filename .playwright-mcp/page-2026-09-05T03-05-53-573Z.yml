            - generic [ref=f47e490]:
              - heading "Step 4. Set up the test webhook app" [level=2] [ref=f47e491]
              - button [ref=f47e492] [cursor=pointer]
            - generic [ref=f47e496]: You will need to set up a webhook endpoint in order to receive notifications about message statuses, such as read and delivered.
            - generic [ref=f47e497]:
              - text: Use the sample webhook server for testing purposes by following the
              - link "Using a test webhook app" [ref=f47e498] [cursor=pointer]:
                - /url: /documentation/business-messaging/whatsapp/webhooks/set-up-whatsapp-echo-bot
              - text: guide.
            - generic [ref=f47e499]: "Once your test webhook application is established, respond in the WhatsApp chat thread you created with yourself. You will see the webhook payload in your test application like this:"
            - generic [ref=f47e500]:
              - generic [ref=f47e501]: "{ \"object\": \"whatsapp_business_account\", \"entry\": [ { \"id\": \"215589313241560883\", \"changes\": [ { \"value\": { \"messaging_product\": \"whatsapp\", \"metadata\": { \"display_phone_number\": \"15551797781\", \"phone_number_id\": \"7794189252778687\" }, \"contacts\": [ { \"profile\": { \"name\": \"Jessica Laverdetman\" }, \"wa_id\": \"13557825698\" } ], \"messages\": [ { \"from\": \"17863559966\", \"id\": \"wamid.HBgLMTc4NjM1NTk5NjYVAGHAYWYET688aASGNTI1QzZFQjhEMDk2QQA=\", \"timestamp\": \"1758254144\", \"text\": { \"body\": \"Hi!\" }, \"type\": \"text\" } ] }, \"field\": \"messages\" } ] } ] }"
              - button [ref=f47e504] [cursor=pointer]
            - separator [ref=f47e507]
            - generic [ref=f47e510]:
              - heading "Step 5. Create a system user and generate a permanent access token" [level=2] [ref=f47e511]
              - button [ref=f47e512] [cursor=pointer]
            - generic [ref=f47e516]:
              - text: The temporary access token you created to send the
              - code [ref=f47e517]: hello_world
              - text: template message expires quickly and is not suitable for development purposes. So you should create a permanent token for use across the WhatsApp Business Platform.
            - list [ref=f47e518]:
              - listitem [ref=f47e520]:
                - text: Navigate to
                - link [ref=f47e521] [cursor=pointer]:
                  - /url: https://business.facebook.com/latest/settings
                  - text: Business Settings
                  - generic [ref=f47e522]:
                    - text: ⁠
                    - img "This link opens in a new tab or window" [ref=f47e523]
                - text: and click
                - strong [ref=f47e526]: System users
                - text: in the sidebar.
              - listitem [ref=f47e528]:
                - text: Click the
                - strong [ref=f47e529]: Add+
                - text: button in the upper-right corner and follow the prompts to create a new system user.
              - listitem [ref=f47e531]:
                - text: Select the new system user you created, and click
                - strong [ref=f47e532]: Assign Assets.
                - list [ref=f47e533]:
                  - listitem [ref=f47e535]:
                    - text: Select your app and toggle
                    - strong [ref=f47e536]: Manage app
                    - text: under
                    - strong [ref=f47e537]: Full control.
                  - listitem [ref=f47e539]:
                    - text: Select your WhatsApp account and toggle
                    - strong [ref=f47e540]: Manage WhatsApp Business accounts
                    - text: under
                    - strong [ref=f47e541]: Full control.
                  - listitem [ref=f47e543]:
                    - text: Click the
                    - strong [ref=f47e544]: Assign assets
                    - text: button.
              - listitem [ref=f47e546]:
                - text: Click
                - strong [ref=f47e547]: Generate token.
                - list [ref=f47e548]:
                  - listitem [ref=f47e550]: Follow the prompts to generate your token.
                  - listitem [ref=f47e552]:
                    - text: "Add the following permissions to the token:"
                    - list [ref=f47e553]:
                      - listitem [ref=f47e555]:
                        - link "business_management" [ref=f47e556] [cursor=pointer]:
                          - /url: https://developers.facebook.com/docs/permissions#b
                      - listitem [ref=f47e558]:
                        - link "whatsapp_business_messaging" [ref=f47e559] [cursor=pointer]:
                          - /url: https://developers.facebook.com/docs/permissions#w
                      - listitem [ref=f47e561]:
                        - link "whatsapp_business_management" [ref=f47e562] [cursor=pointer]:
                          - /url: https://developers.facebook.com/docs/permissions#w
                  - listitem [ref=f47e564]: Copy the token and store it in a secure place to be used in the later steps.
            - separator [ref=f47e565]
            - generic [ref=f47e568]:
              - heading "Step 6. Send a non-template message" [level=2] [ref=f47e569]
              - button [ref=f47e570] [cursor=pointer]
            - generic [ref=f47e574]:
              - text: When you responded to your earlier test message, you triggered what is known as a
              - link "customer service window" [ref=f47e575] [cursor=pointer]:
                - /url: /documentation/business-messaging/whatsapp/messages/send-messages#customer-service-windows
              - text: . This 24-hour window allows you to send
              - link "non-template messages" [ref=f47e576] [cursor=pointer]:
                - /url: /documentation/business-messaging/whatsapp/messages/send-messages#message-types
              - text: to users on WhatsApp. With the customer service window now open, you can send a non-template message to yourself. To do this, insert your test phone number ID, the system user access token, and your phone number in the code sample below, then paste the code into your terminal and run it.
            - generic [ref=f47e577]:
              - code [ref=f47e579]: "curl 'https://graph.facebook.com/v23.0/<TEST_BUSINESS_PHONE_NUMBER_ID>/messages' \\ -H 'Content-Type: application/json' \\ -H 'Authorization: Bearer <SYSTEM_USER_ACCESS_TOKEN>' \\ -d ' { \"messaging_product\": \"whatsapp\", \"recipient_type\": \"individual\", \"to\": \"<WHATSAPP_USER_PHONE_NUMBER>\", \"type\": \"text\", \"text\": { \"body\": \"Hello!\" } }'"
              - button [ref=f47e580] [cursor=pointer]
