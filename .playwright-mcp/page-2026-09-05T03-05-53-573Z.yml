          - article [ref=f47e296]:
            - heading "WhatsApp Cloud API Get Started" [level=1] [ref=f47e297]
            - generic [ref=f47e298]: "Updated: Jun 16, 2026"
            - generic [ref=f47e302]:
              - button "Copy for LLM" [ref=f47e304] [cursor=pointer]
              - link "View as Markdown" [ref=f47e311] [cursor=pointer]:
                - /url: /documentation/business-messaging/whatsapp/get-started.md
            - generic [ref=f47e319]:
              - text: This documentation is for developers building on the WhatsApp Business Platform. If you are a WhatsApp user experiencing issues with your personal account, visit the
              - link [ref=f47e320] [cursor=pointer]:
                - /url: https://l.facebook.com/l.php?u=https%3A%2F%2Ffaq.whatsapp.com%2F&h=AUAk--x7LlFiCyJ6xBEPxM_5qEklpNXFztWyLspuJUzUWr2mTRSWJC_X06Y5N8fcjmhys9h2Y2dsx4NbfN8BfHMrwXj7DY9kdNttKxYFBpSuqsbx4k22iFCTzdp-eV02pjPHFcxPlXhdc09UQPPOTw
                - text: WhatsApp Help Center
                - generic [ref=f47e321]:
                  - text: ⁠
                  - img "This link opens in a new tab or window" [ref=f47e322]
              - text: for support.
            - generic [ref=f47e325]: This guide helps developers quickly get started with the WhatsApp Cloud API. It covers the basic setup steps, including registering as a developer, creating a Meta app, sending your first message, and setting up a test webhook endpoint. You’ll also learn how to generate secure access tokens and send both template and non-template messages. Advanced features and further resources are introduced for deeper exploration.
            - separator [ref=f47e326]
            - generic [ref=f47e329]:
              - heading "Download the sample app" [level=2] [ref=f47e330]
              - button [ref=f47e331] [cursor=pointer]
            - generic [ref=f47e335]: The Jasper’s Market sample app contains all of the messages and code used in the Jasper’s Market demo. You can use this sample app to learn how to build an application that sends and handles WhatsApp Cloud API data.
            - link "Download the Jasper’s Market Sample App" [ref=f47e337] [cursor=pointer]:
              - /url: https://l.facebook.com/l.php?u=https%3A%2F%2Fgithub.com%2Ffbsamples%2Fwhatsapp-business-jaspers-market&h=AUAk--x7LlFiCyJ6xBEPxM_5qEklpNXFztWyLspuJUzUWr2mTRSWJC_X06Y5N8fcjmhys9h2Y2dsx4NbfN8BfHMrwXj7DY9kdNttKxYFBpSuqsbx4k22iFCTzdp-eV02pjPHFcxPlXhdc09UQPPOTw
            - separator [ref=f47e341]
            - generic [ref=f47e344]:
              - heading "Prerequisites" [level=2] [ref=f47e345]
              - button [ref=f47e346] [cursor=pointer]
            - list [ref=f47e350]:
              - listitem [ref=f47e352]: Facebook account or managed Meta account
              - listitem [ref=f47e354]:
                - text: Developer registration
                - list [ref=f47e355]:
                  - listitem [ref=f47e357]:
                    - text: If not yet registered, visit the
                    - link "developer registration page" [ref=f47e358] [cursor=pointer]:
                      - /url: https://developers.facebook.com/async/registration/
                    - text: and follow the prompts.
              - listitem [ref=f47e360]: WhatsApp-enabled device for sending and receiving test messages
            - separator [ref=f47e361]
            - generic [ref=f47e364]:
              - heading "Step 1. Create a new Meta app with WhatsApp" [level=2] [ref=f47e365]
              - button [ref=f47e366] [cursor=pointer]
            - list [ref=f47e370]:
              - listitem [ref=f47e372]:
                - text: Open the
                - link "Meta App Dashboard" [ref=f47e373] [cursor=pointer]:
                  - /url: https://developers.facebook.com/apps
                - text: to create a new Meta app with the WhatsApp use case.
              - listitem [ref=f47e375]:
                - text: Click
                - strong [ref=f47e376]: Create App
                - text: .
              - listitem [ref=f47e378]: Add your app’s name and your email.
              - listitem [ref=f47e380]:
                - text: Select the
                - strong [ref=f47e381]: Connect with customers through WhatsApp
                - text: use case and click
                - strong [ref=f47e382]: Next
                - text: .
              - listitem [ref=f47e384]: Select an existing business portfolio or create a new one.
              - listitem [ref=f47e386]:
                - text: A list of publishing requirements are listed. You may not have any at this point. Click
                - strong [ref=f47e387]: Next
                - text: .
              - listitem [ref=f47e389]:
                - text: Confirm your details, use case, and business portfolio. Click
                - strong [ref=f47e390]: Previous
                - text: to make changes or
                - strong [ref=f47e391]: Create app
                - text: to complete app creation.
            - generic [ref=f47e392]:
              - text: After creating your app with the WhatsApp use case you are redirected to the
              - strong [ref=f47e393]: Customize use case > Connect on WhatsApp > Quickstart
              - text: page in the dashboard.
            - generic [ref=f47e396]:
              - heading "Step 2. Start using the API" [level=2] [ref=f47e397]
              - button [ref=f47e398] [cursor=pointer]
            - list [ref=f47e402]:
              - listitem [ref=f47e404]:
                - text: Click the
                - strong [ref=f47e405]: Start using the API
                - text: button to set up the API by adding a phone number and sending your first message. You are redirected to the
                - strong [ref=f47e406]: API Setup
                - text: page.
              - listitem [ref=f47e408]:
                - text: In the
                - strong [ref=f47e409]: API Setup
                - text: "section, connect your app to a WhatsApp Business account. This connection allows your app to access the WhatsApp Cloud API and send messages on behalf of your business. Select an existing WhatsApp Business account or create a new one:"
                - list [ref=f47e410]:
                  - listitem [ref=f47e412]:
                    - strong [ref=f47e413]: "To use an existing account:"
                    - text: Select the WhatsApp Business account from the dropdown menu.
                  - listitem [ref=f47e415]:
                    - strong [ref=f47e416]: "To create a new account:"
                    - text: Click
                    - strong [ref=f47e417]: Create a WhatsApp Business account
                    - text: and follow the prompts to set up your business profile.
              - listitem [ref=f47e419]:
                - text: Once connected, you will see your WhatsApp Business account ID displayed in the API Setup panel.
                - list [ref=f47e420]:
                  - listitem [ref=f47e422]: Save this ID for use in API calls.
            - blockquote [ref=f47e423]:
              - generic [ref=f47e424]:
                - strong [ref=f47e425]: "Note:"
                - text: If you created a new Meta Business Portfolio during app creation, a WhatsApp Business account may have been automatically created for you. Verify the connection in the API Setup section before proceeding.
            - separator [ref=f47e426]
            - generic [ref=f47e429]:
              - heading "Step 3. Send and receive messages" [level=2] [ref=f47e430]
              - button [ref=f47e431] [cursor=pointer]
            - list [ref=f47e435]:
              - listitem [ref=f47e437]:
                - text: Click
                - strong [ref=f47e438]: Generate access token
                - text: to generate a temporary access token to send a test message.
              - listitem [ref=f47e440]:
                - text: Select a
                - strong [ref=f47e441]: From
                - text: phone number, or add a new one, from the dropdown menu.
              - listitem [ref=f47e443]:
                - text: Add a
                - strong [ref=f47e444]: To
                - text: phone number that will receive the test message.
              - listitem [ref=f47e446]:
                - text: Click the
                - strong [ref=f47e447]: Send message
                - text: button to send your first message.
                - list [ref=f47e448]:
                  - listitem [ref=f47e450]: Make sure to retain both your test phone number ID and WhatsApp Business account ID for later use.
              - listitem [ref=f47e452]: Once you receive the message you sent, make sure to reply back to keep the conversation going.
            - generic [ref=f47e453]: The left-side menu lists ways in which you can customize use case settings and permissions to make your app work the way you want it to. You can update these settings at any time.
