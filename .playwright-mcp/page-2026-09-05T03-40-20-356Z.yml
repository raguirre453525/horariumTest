                  - /url: /documentation/development
              - listitem [ref=f102e216]:
                - generic [ref=f102e217]: Basic Settings
          - article [ref=f102e220]:
            - heading "Basic Settings" [level=1] [ref=f102e221]
            - generic [ref=f102e222]: "Updated: Oct 18, 2023"
            - generic [ref=f102e226]:
              - button "Copy for LLM" [ref=f102e228] [cursor=pointer]
              - link "View as Markdown" [ref=f102e235] [cursor=pointer]:
                - /url: /documentation/development/create-an-app/app-dashboard/basic-settings.md
            - generic [ref=f102e241]: The Basic settings page gives you one place to configure important settings, like your apps’ name, contact email, and category, and find the app secret assigned to your app by Meta. The settings listed in this document are needed for you to build an app on the Meta Platform.
            - generic [ref=f102e244]:
              - heading "General Settings" [level=2] [ref=f102e245]
              - button [ref=f102e246] [cursor=pointer]
            - generic [ref=f102e250]: General settings contains unique identifiers assigned to your app and allows you to provide additional information to further define and describe your app. These identifiers allows us to identify your app when it makes API calls, and helps us determine which permissions and features your app has been granted by app users, and are used to generate access tokens.
            - generic [ref=f102e253]:
              - heading "App ID" [level=3] [ref=f102e254]
              - button [ref=f102e255] [cursor=pointer]
            - generic [ref=f102e259]: When you create a Facebook app we generate and assign it a unique ID. This ID must be included when making any calls to our APIs. All of our SDKs provide a way for you to easily set this value in your codebase so that will automatically be included with any API calls.
            - generic [ref=f102e262]:
              - heading "App Secret" [level=3] [ref=f102e263]
              - button [ref=f102e264] [cursor=pointer]
            - generic [ref=f102e268]:
              - text: Your app secret is used in some of the
              - link "Facebook Login" [ref=f102e269] [cursor=pointer]:
                - /url: /documentation/facebook-login
              - text: flows to generate an
              - link "App access token" [ref=f102e270] [cursor=pointer]:
                - /url: /documentation/facebook-login/guides/access-tokens#apptokens
              - text: which can make API requests on behalf of any user of the app. It is extremely important that an App Secret be stored securely and not be included in any code that could be accessed by anyone other than a developer of the app.
            - generic [ref=f102e271]: We recommend that App access tokens only be used directly from your app’s servers in order to provide the best security. For native apps, we suggest that the app communicates with your own server and the server then makes the API requests to Facebook using the App access token.
            - generic [ref=f102e274]:
              - heading "Resetting App Secret" [level=4] [ref=f102e275]
              - button [ref=f102e276] [cursor=pointer]
            - generic [ref=f102e280]:
              - text: If your App Secret is compromised, you should reset it immediately in the
              - link "Basic Settings of your App Dashboard" [ref=f102e281] [cursor=pointer]:
                - /url: /apps/
              - text: . It is not possible to programmatically rotate the app secret.
            - generic [ref=f102e282]: If Meta discovers the app secret has been leaked and user data is at risk, Meta will notify you to reset the app secret immediately. If you do not reply in a timely manner, Meta will reset the app secret. This will cause all the business integrations to stop working as user data grants for the app will be revoked. This is a very disruptive process which will only happen if there is a risk to user data and you do not reset the app secret quickly.
            - generic [ref=f102e287]:
              - heading "Display Name" [level=3] [ref=f102e288]
              - button [ref=f102e289] [cursor=pointer]
            - generic [ref=f102e293]:
              - text: The display name is the user facing name of your app that will be displayed in the
              - link "App Center" [ref=f102e294] [cursor=pointer]:
                - /url: /docs/games/listing
              - text: . This field is required to switch your app to Live mode.
            - generic [ref=f102e297]:
              - heading "Display Name Guidelines" [level=4] [ref=f102e298]
              - button [ref=f102e299] [cursor=pointer]
            - generic [ref=f102e303]:
              - text: Follow these guidelines when choosing or modifying your app’s display name, otherwise it will be rejected during
              - link "App Review" [ref=f102e304] [cursor=pointer]:
                - /url: /docs/app-review
              - text: .
            - list [ref=f102e305]:
              - listitem [ref=f102e307]: Do not use names that include Facebook or FB, or any names of Facebook products such as Oculus, WhatsApp, or Instagram.
              - listitem [ref=f102e309]: Do not use “F”, “Book”, or “Face” in your name if it could be perceived as a reference to Facebook.
              - listitem [ref=f102e311]:
                - text: Do not use
                - link [ref=f102e312] [cursor=pointer]:
                  - /url: https://l.facebook.com/l.php?u=https%3A%2F%2Fwww.facebookbrand.com%2Ftrademarks&h=AUBSvX4tPLLxq2YJLLFR7-Y5St5y9Qw-v7h6KwZjp3gj5ShZmTvNe1BampuZZijKdN-8P4_nJDrILx_lH-zPFWDTwEDMBDjp0w70dFBqho6FU2k04Y02JAmL2EY54NaZhgt87aimYFDE0a2RQqCCKg
                  - text: our brands
                  - generic [ref=f102e313]:
                    - text: ⁠
                    - img "This link opens in a new tab or window" [ref=f102e314]
                - text: in a way that implies partnership, sponsorship, or endorsement by us.
              - listitem [ref=f102e318]:
                - text: Do not combine any part of
                - link [ref=f102e319] [cursor=pointer]:
                  - /url: https://l.facebook.com/l.php?u=https%3A%2F%2Fwww.facebookbrand.com%2Ftrademarks&h=AUBSvX4tPLLxq2YJLLFR7-Y5St5y9Qw-v7h6KwZjp3gj5ShZmTvNe1BampuZZijKdN-8P4_nJDrILx_lH-zPFWDTwEDMBDjp0w70dFBqho6FU2k04Y02JAmL2EY54NaZhgt87aimYFDE0a2RQqCCKg
                  - text: our brands
                  - generic [ref=f102e320]:
                    - text: ⁠
                    - img "This link opens in a new tab or window" [ref=f102e321]
                - text: with your name.
              - listitem [ref=f102e325]:
                - text: Do not use names or logos that imitate or could be confused with
                - link [ref=f102e326] [cursor=pointer]:
                  - /url: https://l.facebook.com/l.php?u=https%3A%2F%2Fwww.facebookbrand.com%2Ftrademarks&h=AUBSvX4tPLLxq2YJLLFR7-Y5St5y9Qw-v7h6KwZjp3gj5ShZmTvNe1BampuZZijKdN-8P4_nJDrILx_lH-zPFWDTwEDMBDjp0w70dFBqho6FU2k04Y02JAmL2EY54NaZhgt87aimYFDE0a2RQqCCKg
                  - text: our brands
                  - generic [ref=f102e327]:
                    - text: ⁠
                    - img "This link opens in a new tab or window" [ref=f102e328]
              - listitem [ref=f102e332]: Do not present our brand assets in a way that make them the most distinctive or prominent feature of your app.
            - generic [ref=f102e335]:
              - heading "Namespace" [level=3] [ref=f102e336]
              - button [ref=f102e337] [cursor=pointer]
            - generic [ref=f102e341]: The namespace URL links to your app’s Canvas page. The Canvas page is used to tell user about your app.
            - generic [ref=f102e344]:
              - heading "App Domains" [level=3] [ref=f102e345]
              - button [ref=f102e346] [cursor=pointer]
            - generic [ref=f102e350]: Domains and subdomains of your app for app installation and are used during Graph API request for verification.
            - generic [ref=f102e353]:
              - heading "Contact Email" [level=3] [ref=f102e354]
              - button [ref=f102e355] [cursor=pointer]
            - generic [ref=f102e359]:
              - text: The contact email is the email address where
              - link "developer notifications" [ref=f102e360] [cursor=pointer]:
                - /url: /documentation/development/create-an-app/developer-settings
              - text: will be sent. These notifications will also surface in the Alerts in the App Dashboard. This field is required to switch your app to Live mode.
            - generic [ref=f102e363]:
              - heading "Privacy Policy URL" [level=3] [ref=f102e364]
              - button [ref=f102e365] [cursor=pointer]
            - generic [ref=f102e369]: The Privacy Policy URL links to your app’s privacy policy that applies to your app users.
            - generic [ref=f102e372]:
              - heading "Terms of Service URL" [level=3] [ref=f102e373]
              - button [ref=f102e374] [cursor=pointer]
            - generic [ref=f102e378]: The Terms of Service URL links to the Terms of Service for your app that applies to your app users. This field is required to switch your app to Live mode.
            - generic [ref=f102e381]:
              - heading "User Data Deletion" [level=3] [ref=f102e382]
              - button [ref=f102e383] [cursor=pointer]
            - generic [ref=f102e387]: The User Data Delection URL links to explicit instructions for your app users on how to delete their data from your app. This URL may be the relevant section in the application’s Privacy Policy.
            - generic [ref=f102e388]: The data deletion URL is called when users remove your app by way of the Facebook’s Apps and Website settings page, and then in the Removed section, click your app and request that their data be deleted.
            - generic [ref=f102e389]:
              - text: Learn more about
              - link "data deletion" [ref=f102e390] [cursor=pointer]:
                - /url: /documentation/development/create-an-app/app-dashboard/data-deletion-callback
              - text: .
            - generic [ref=f102e393]:
              - heading "App Icon" [level=3] [ref=f102e394]
              - button [ref=f102e395] [cursor=pointer]
            - generic [ref=f102e399]: The App Icon represents your app in the App Center. This field is required to switch your app to Live mode.
            - generic [ref=f102e402]:
              - heading "App Icon Guidelines" [level=4] [ref=f102e403]
              - button [ref=f102e404] [cursor=pointer]
            - generic [ref=f102e408]:
              - text: Follow these guidelines when uploading or replacing your app icon, otherwise it will be rejected during
              - link "App Review" [ref=f102e409] [cursor=pointer]:
                - /url: /docs/app-review
              - text: .
            - list [ref=f102e410]:
              - listitem [ref=f102e412]: Do not use or incorporate any of our logos, trademarks, icons, or any modified forms or variations of them. This includes logos, trademarks, and icons for any of our products, such as Facebook, Instagram, Oculus, or WhatsApp.
              - listitem [ref=f102e414]: Do not include “Facebook” or “FB”.
            - generic [ref=f102e417]:
              - heading "Category" [level=3] [ref=f102e418]
              - button [ref=f102e419] [cursor=pointer]
            - generic [ref=f102e423]:
              - text: Your app’s
              - link "category" [ref=f102e424] [cursor=pointer]:
                - /url: /documentation/development/create-an-app/app-dashboard/app-categories
              - text: helps users discover new apps based on their search. This field is required to switch your app to Live mode.
            - generic [ref=f102e427]:
              - heading "App Purpose" [level=3] [ref=f102e428]
              - button [ref=f102e429] [cursor=pointer]
            - generic [ref=f102e433]: Your app’s purpose is used during App Review to tell us how your app will access and use your data or data of others. This field is required to switch your app to Live mode.
            - generic [ref=f102e436]:
              - heading "Business Verification" [level=2] [ref=f102e437]
              - button [ref=f102e438] [cursor=pointer]
            - generic [ref=f102e442]: Business Verification is a process that allows Facebook to verify your identity as a business entity. This is required io access data that is not owned by you. While verification is not required to Go Live, you will not be able to access data you do not own until verification is complete.
            - generic [ref=f102e443]:
              - text: Learn more about
              - link "Business Verification" [ref=f102e444] [cursor=pointer]:
                - /url: /documentation/development/release/business-verification
              - text: .
            - generic [ref=f102e447]:
              - heading "Verification Status" [level=3] [ref=f102e448]
              - button [ref=f102e449] [cursor=pointer]
            - generic [ref=f102e453]: After you have submitted for verification, your status will be Pending then Verified once Meta has verified your Business information.
            - generic [ref=f102e456]:
              - heading "Data Protection Officer Contact Information" [level=2] [ref=f102e457]
              - button [ref=f102e458] [cursor=pointer]
            - generic [ref=f102e462]: The General Data Protection Regulation (GDPR) requires certain companies that serve individuals in the European Union to designate and publish contact information for a Data Protection Officer (DPO) who can assist with matters related to the processing of personal information. This information will be made available in your apps and website settings so that your app users can contact your DPO if they have questions about how their data is processed and used.
