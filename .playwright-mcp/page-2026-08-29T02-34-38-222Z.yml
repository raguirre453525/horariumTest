              - heading "Tokens de acceso de usuario" [level=2] [ref=f10e466]
              - button [ref=f10e467] [cursor=pointer]
            - generic [ref=f10e471]:
              - text: Si bien todos los desarrolladores de apps admiten y pueden usar los tokens de acceso de usuario, por lo general, solo se utilizan al usar por primera vez el panel de apps para
              - link "enviar tu primer mensaje de prueba" [ref=f10e472] [cursor=pointer]:
                - /url: /documentation/business-messaging/whatsapp/get-started
              - text: . Sin embargo, cuando desarrolles tu app, cambiarás a un token de acceso de usuario del sistema (y tal vez a un token de acceso de usuario del sistema de integración comercial, si eres proveedor de tecnología o socio). Esto se debe a que los tokens de acceso de usuario caducan rápidamente, por lo que tienes que generar uno nuevo cada pocas horas.
            - generic [ref=f10e473]: "Hay varias maneras de generar un token de acceso de usuario:"
            - list [ref=f10e474]:
