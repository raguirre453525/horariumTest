                - /url: "#employee-system-users"
              - text: .
            - generic [ref=f10e367]:
              - heading "Usuarios administradores del sistema" [level=3] [ref=f10e368]
              - button [ref=f10e369] [cursor=pointer]
            - generic [ref=f10e373]: De manera predeterminada, los usuarios administradores del sistema tienen acceso total a todas las cuentas de WhatsApp Business (WABA) y sus activos, ya sean propios o compartidos contigo o con tu portfolio comercial.
            - generic [ref=f10e374]: Los usuarios administradores del sistema son útiles si tu app necesita acceso a todos los activos del portfolio comercial, dado que no es necesario otorgar manualmente acceso a cada activo comercial cuando se crea o se comparte con tu portfolio comercial.
            - generic [ref=f10e375]:
              - text: Ten en cuenta que puedes anular el acceso predeterminado de un usuario administrador del sistema a los activos comerciales si otorgas acceso parcial a cada WABA. Consulta
              - link "Acceso a activos comerciales" [ref=f10e376] [cursor=pointer]:
                - /url: "#business-asset-access"
              - text: para aprender a configurar y anular el acceso.
            - generic [ref=f10e379]:
              - heading "Usuarios empleados del sistema" [level=3] [ref=f10e380]
              - button [ref=f10e381] [cursor=pointer]
            - generic [ref=f10e385]: Los usuarios empleados del sistema deben obtener acceso a determinadas WABA que son propiedad de tu portfolio comercial o que se comparten con este. Si tu app solo necesita acceso a algunas de tus WABA, un usuario empleado del sistema es suficiente.
