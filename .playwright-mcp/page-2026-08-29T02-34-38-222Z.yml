            - generic [ref=f10e457]: Los tokens de acceso de usuario del sistema de integración comercial ("tokens de empresa") se extienden a clientes individuales registrados y deben ser usados por los proveedores de tecnología y socios de soluciones cuando acceden a los datos de los clientes registrados.
            - generic [ref=f10e458]: Estos tokens son útiles para las apps que realizan acciones programáticas y automatizadas en las WABA del cliente, ya que no se basan en entradas de los usuarios de la app ni es necesario volver a autenticarlos en el futuro.
            - generic [ref=f10e459]: Para generar un token de acceso de usuario del sistema de integración comercial, debes implementar el registro insertado (configurado con el inicio de sesión con Facebook para empresas) e intercambiar el código que se devuelve cuando un cliente completa el proceso.
