            - generic [ref=f10e351]:
              - heading "Token de acceso de usuario del sistema" [level=2] [ref=f10e352]
              - button [ref=f10e353] [cursor=pointer]
            - generic [ref=f10e357]: Los tokens de acceso de usuario del sistema ("tokens del sistema") te representan a ti, a tu empresa u organización, o a personas que pertenecen a estas. La ventaja principal de estos tokens es que tienen una larga duración y pueden representar servicios automatizados dentro de tu empresa, que no requieren entradas del usuario.
            - generic [ref=f10e358]:
              - text: Los tokens del sistema dependen de los usuarios del sistema. La mayoría de los puntos de conexión verifican si el usuario que identificó el token tiene acceso al recurso solicitado. Si el usuario no tiene acceso al recurso, el sistema rechazará la solicitud con el código de error
              - link [ref=f10e359] [cursor=pointer]:
                - /url: /documentation/business-messaging/whatsapp/support/error-codes
                - code [ref=f10e360]: "200"
              - text: (no debe confundirse con el código de estado HTTP
              - code [ref=f10e361]: "200"
              - text: ).
            - generic [ref=f10e362]:
              - text: Los usuarios del sistema pueden ser
