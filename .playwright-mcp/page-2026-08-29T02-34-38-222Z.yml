                - text: ">"
                - strong [ref=f10e478]: WhatsApp
                - text: ">"
                - strong [ref=f10e479]: Configuración de API
                - text: . Este panel genera un nuevo token de acceso de usuario cada vez que lo visitas. El token se extiende automáticamente a tu usuario, ya que inicias sesión con tu cuenta de desarrollador cuando accedes al panel.
              - listitem [ref=f10e481]:
