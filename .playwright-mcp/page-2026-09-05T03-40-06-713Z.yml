              - listitem [ref=f101e216]:
                - generic [ref=f101e217]: Privacy Policy Expectations
          - article [ref=f101e220]:
            - heading "Privacy Policy Expectations" [level=1] [ref=f101e221]
            - generic [ref=f101e222]: "Updated: Feb 3, 2025"
            - generic [ref=f101e226]:
              - button "Copy for LLM" [ref=f101e228] [cursor=pointer]
              - link "View as Markdown" [ref=f101e235] [cursor=pointer]:
                - /url: /documentation/development/terms-and-policies/privacy-policy.md
            - generic [ref=f101e241]: This document contains the minimum expectations for what your privacy policy should include. Please note that this is not intended to be, and is not, an exhaustive list of all possible considerations that are involved in creating a privacy policy. Your privacy policy should comprehensively and fully disclose all of your privacy practices and also comply with any applicable laws and regulations, so you may need to include additional or unique information to comply with certain laws and regulations.
            - generic [ref=f101e242]:
              - text: Find more video resources from
              - link [ref=f101e243] [cursor=pointer]:
                - /url: https://l.facebook.com/l.php?u=https%3A%2F%2Fapp.dataprotocol.com%2Fchannels%2Fmeta&h=AUC7VNc4cyBNRYcYLVCBVvmSkzPEBA9G2uIeBqPAxX2WIX-xWXrEJDS_hj07DwBYeWjiqb_mT2H8ijWB0gDZP8qr_VzSruY7AUPKM_aSaJWtw_i7qqOHHshCYshXOQhtiJ_2uCh_1Wehi8ZGcMU8cw
                - text: Data Protocol
                - generic [ref=f101e244]:
                  - text: ⁠
                  - img "This link opens in a new tab or window" [ref=f101e245]
              - text: .
            - generic [ref=f101e250]:
              - heading "Why Meta Requires Developers to have a Privacy Policy" [level=2] [ref=f101e251]
              - button [ref=f101e252] [cursor=pointer]
            - generic [ref=f101e256]: Privacy disclosures help users understand what data you collect, why you collect it, and what you do with that data. Disclosures generally should be comprehensive, accurate, and easy for users to understand.
            - generic [ref=f101e259]:
              - heading "What a basic privacy policy should say" [level=2] [ref=f101e260]
              - button [ref=f101e261] [cursor=pointer]
            - list [ref=f101e265]:
              - listitem [ref=f101e267]:
                - strong [ref=f101e268]: What information do you collect
            - generic [ref=f101e269]: In general, you should disclose the information that you collect from the user or about the user, either directly or via third parties. This includes any information collected automatically, such as browser information, server information, or usage information; in addition to information that you get from the user, either directly or via a permissions API.
            - list [ref=f101e270]:
              - listitem [ref=f101e272]:
                - strong [ref=f101e273]: How you process that information and the purpose for collecting that information.
            - generic [ref=f101e274]: Your privacy policy should disclose how you use the information you collect and a clear purpose for why you are processing user data. For example, you may use the information to provide certain services to users, to recognize them the next time they use your app, or to send them promotional emails.
            - list [ref=f101e275]:
              - listitem [ref=f101e277]:
                - strong [ref=f101e278]: How can the user request that their data be deleted?
            - generic [ref=f101e279]: Your privacy policy should describe a clear way for users to request the deletion of their data. This may be an email or a contact form, which should be up to date and valid.
            - strong [ref=f101e281]: "In addition to some content requirements, our policies also require that links to your privacy policy be made available as follows:"
            - generic [ref=f101e284]:
              - heading [level=2] [ref=f101e285]:
                - link "Meta Platform Terms - 4. Privacy Policy" [ref=f101e286] [cursor=pointer]:
                  - /url: https://developers.facebook.com/terms#privacypolicy
              - button [ref=f101e287] [cursor=pointer]
            - generic [ref=f101e291]:
              - strong [ref=f101e292]: 4.a
              - emphasis [ref=f101e293]: “You will provide, maintain, and comply with a privacy policy that is available through an active, publicly available, easily accessible (including by our crawlers), and non-geoblocked URL. This URL must also be disclosed in the privacy policy field in the settings of your App Dashboard.”
            - generic [ref=f101e294]: The purpose of this policy is to provide your users and the public with a privacy policy on your website. Make sure that your privacy policy isn’t hidden or difficult to find, and that it isn’t geo-blocked to prevent users from certain locations from viewing it.
            - strong [ref=f101e296]: "Crawler Access to Privacy Policies and URLs:"
            - generic [ref=f101e297]: As part of our ongoing efforts to protect people’s privacy on Facebook, we use crawlers to ensure that URLs are live and accessible to people using third party apps. As such URLs must be publicly available. We’re updating our policies to ensure developers allow our crawler to access URLs specified in apps’ settings. This includes any developer-controlled URLs, including the privacy policy URL, connect URL, and other product-specific URLs.
            - list [ref=f101e298]:
              - listitem [ref=f101e300]:
                - text: All developers must provide a link to a privacy policy that explains
                - strong [ref=f101e301]: what data is collected and how it is used, explain the purposes for which the data is being processed, and how users may request deletion of that data.
              - listitem [ref=f101e303]: The linked page must be clearly marked as a privacy policy.
              - listitem [ref=f101e305]: The privacy policy must be your own privacy policy, and not the policy of another company.
              - listitem [ref=f101e307]: Ensure links to privacy policy are live, clickable, accessible to Meta’s crawlers and not geo-blocked on the App Dashboard and on the website.
              - listitem [ref=f101e309]: Broken privacy policy links are considered violations and are subject to enforcement.
              - listitem [ref=f101e311]: We recommend using the sharing debugger to check if the URL is valid (having an 200 response code) before submitting the change.
            - generic [ref=f101e312]: "For more information, see:"
            - list [ref=f101e313]:
              - listitem [ref=f101e315]:
                - link /docs/sharing/webmasters/crawler/ [ref=f101e316] [cursor=pointer]:
                  - /url: /documentation/sharing/webmasters/web-crawlers
              - listitem [ref=f101e318]:
                - link "https://developers.facebook.com/blog/post/2020/11/10/introducing-graph-v9-marketing-api-v9/" [ref=f101e319] [cursor=pointer]:
                  - /url: /blog/post/2020/11/10/introducing-graph-v9-marketing-api-v9/
            - generic [ref=f101e320]: To update the privacy policy URL, go to the App Dashboard and update the URL in Settings.
