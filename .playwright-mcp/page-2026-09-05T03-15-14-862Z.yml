          - article [ref=f91e210]:
            - heading "Publish" [level=1] [ref=f91e211]
            - generic [ref=f91e212]: "Updated: May 5, 2025"
            - generic [ref=f91e216]:
              - button "Copy for LLM" [ref=f91e218] [cursor=pointer]
              - link "View as Markdown" [ref=f91e225] [cursor=pointer]:
                - /url: /documentation/development/release.md
            - generic [ref=f91e231]:
              - text: Once you have completed app
              - link "development and testing" [ref=f91e232] [cursor=pointer]:
                - /url: /documentation/development/build-and-test
              - text: ", you can publish your app. Publishing means to make your app available to accounts that do not have a"
              - link "role" [ref=f91e233] [cursor=pointer]:
                - /url: /documentation/development/build-and-test/app-roles
              - text: on the app itself. This document lists the processes and app settings that may be required before you can publish your app successfully.
            - generic [ref=f91e234]: If your app will only be used by people who have a role on the app itself you do not need to complete any of these processes because your app is already available to these users.
            - generic [ref=f91e235]:
              - text: If you have already published your app and want to add new functionality that requires App Review, follow the steps in our
              - link "App Review For Published Apps" [ref=f91e236] [cursor=pointer]:
                - /url: /docs/app-review/introduction#app-review-for-live-apps
              - text: instructions.
            - generic [ref=f91e239]:
              - heading "App Review" [level=2] [ref=f91e240]
              - button [ref=f91e241] [cursor=pointer]
            - generic [ref=f91e245]:
              - text: If your app will be used by anyone who does not have a role on it, it must undergo
              - link "App Review" [ref=f91e246] [cursor=pointer]:
                - /url: /docs/app-review
              - text: .
            - generic [ref=f91e247]:
              - text: App Review is a process that allows you to request approval for specific API
              - link "permissions" [ref=f91e248] [cursor=pointer]:
                - /url: /docs/permissions/reference
              - text: and
              - link "features" [ref=f91e249] [cursor=pointer]:
                - /url: /docs/apps/features-reference
              - text: that your app needs to function properly. Only permissions approved through the App Review process can be granted to your app by app users without a role on the app, and only approved features will be active for those users.
            - generic [ref=f91e250]: App Review requires you to identify each of the permissions and features your app needs, describe why your app needs them, and show us how your app uses the data returned or accepted by our APIs.
            - generic [ref=f91e251]:
              - text: Learn more about the
              - link "App Review" [ref=f91e252] [cursor=pointer]:
                - /url: /docs/app-review
              - text: process.
            - generic [ref=f91e255]:
              - heading "Business Verification" [level=2] [ref=f91e256]
              - button [ref=f91e257] [cursor=pointer]
            - generic [ref=f91e261]:
              - text: Business Verification is a process that allows us to verify your identity as a business entity. Apps that request advanced access for permissions and apps that allow other Businesses to access their own data must be connected to a Business that has completed
              - link "Business Verification" [ref=f91e262] [cursor=pointer]:
                - /url: /documentation/development/release/business-verification
              - text: . Until then, app users from other Businesses will be unable to grant these apps permissions and all features will be inactive.
            - generic [ref=f91e263]:
              - text: Learn more about
              - link "Business Verification" [ref=f91e264] [cursor=pointer]:
                - /url: /documentation/development/release/business-verification
              - text: .
            - generic [ref=f91e267]:
              - heading "Go live" [level=2] [ref=f91e268]
              - button [ref=f91e269] [cursor=pointer]
            - generic [ref=f91e273]: To allow people, who do not have a role on your app, to use your app, you need to publish it. If your app requires App Review, App Review must be completed successfully before people can use your app.
            - generic [ref=f91e276]:
              - heading "Use Case Apps" [level=3] [ref=f91e277]
              - button [ref=f91e278] [cursor=pointer]
            - generic [ref=f91e282]:
              - text: To publish your use case app go to the app dashboard
              - strong [ref=f91e283]: Publish > Go live
              - text: and click the
              - strong [ref=f91e284]: Go live
              - text: button in the bottom right corner.
            - generic [ref=f91e287]:
              - heading "App Types" [level=3] [ref=f91e288]
              - button [ref=f91e289] [cursor=pointer]
            - generic [ref=f91e293]:
              - text: You must switch your app to
              - link "Live" [ref=f91e294] [cursor=pointer]:
                - /url: /documentation/development/build-and-test/app-modes
              - text: mode before it can request
              - link "App Review" [ref=f91e295] [cursor=pointer]:
                - /url: /docs/app-review
              - text: approved permissions from app users who do not have a role on it, and before approved features will be active for those users. However, you should not switch to Live mode until all of the permissions and features that your app requires have been approved, and not before you have completed
              - link "Business Verification" [ref=f91e296] [cursor=pointer]:
                - /url: /documentation/development/release/business-verification
              - text: if required to do so. If you switch your app to Live mode prematurely, your app will be unable to request unapproved permission from app users, and any unapproved permissions will be inactive.
            - generic [ref=f91e297]:
              - link "Consumer" [ref=f91e298] [cursor=pointer]:
                - /url: /documentation/development/create-an-app/app-dashboard/app-types#consumer
              - text: apps behave a little differently because they also rely on
              - link "access levels" [ref=f91e299] [cursor=pointer]:
                - /url: /docs/graph-api/overview/access-levels
              - text: . Consumer apps in Live mode cannot request permissions with Standard Access from app users who do not have a
              - link "role" [ref=f91e300] [cursor=pointer]:
                - /url: /documentation/development/build-and-test/app-roles
              - text: on them, and features with Standard Access will be inactive for these users.
            - generic [ref=f91e301]: Business apps do not have app modes and rely exclusively on access levels.
            - generic [ref=f91e304]:
              - heading "Releasing New Versions of Live Apps" [level=3] [ref=f91e305]
              - button [ref=f91e306] [cursor=pointer]
            - generic [ref=f91e310]:
