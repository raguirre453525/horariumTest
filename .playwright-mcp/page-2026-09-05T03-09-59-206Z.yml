            - generic [ref=f59e572]:
              - heading "Validation" [level=3] [ref=f59e573]
              - button [ref=f59e574] [cursor=pointer]
            - generic [ref=f59e578]: "To validate the request:"
            - list [ref=f59e579]:
              - listitem [ref=f59e581]:
                - text: Generate an HMAC-SHA256 hash using the JSON payload as the message input and your
                - link "app secret" [ref=f59e582] [cursor=pointer]:
                  - /url: /docs/development/create-an-app/app-dashboard/basic-settings#app-secret
                - text: as the secret key.
              - listitem [ref=f59e584]:
                - text: Compare your generated hash to the hash assigned to the
                - code [ref=f59e585]: X-Hub-Signature-256
                - text: header (everything after
                - code [ref=f59e586]: sha256=
                - text: ).
            - generic [ref=f59e587]: If the hashes match, the payload is valid. Capture the payload and digest the payload contents according to business needs. If they do not match, consider the payload invalid.
            - generic [ref=f59e588]: There are no APIs for fetching historical webhook data, so capture and store webhook payloads accordingly.
            - generic [ref=f59e591]:
              - heading "Response" [level=3] [ref=f59e592]
              - button [ref=f59e593] [cursor=pointer]
            - generic [ref=f59e597]: If the request is valid, respond with HTTP status 200. Otherwise, respond with a 400-level HTTP status, or anything other than status 200.
            - generic [ref=f59e600]:
              - heading "Batching" [level=3] [ref=f59e601]
              - button [ref=f59e602] [cursor=pointer]
            - generic [ref=f59e606]: POST requests are aggregated and sent in a batch with a maximum of 1000 updates. However, batching cannot be guaranteed so be sure to adjust your servers to handle each POST request individually.
            - generic [ref=f59e607]: If any POST request sent to your server fails, delivery is retried immediately, then a few more times with decreasing frequency over the next 7 days. Your server should handle deduplication in these cases.
            - generic [ref=f59e608]: Unacknowledged responses will be dropped after 7 days.
