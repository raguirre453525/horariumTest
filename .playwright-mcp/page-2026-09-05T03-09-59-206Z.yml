            - generic [ref=f59e348]: Learn about webhook requests and responses so you can set up and configure your own webhook endpoint on a public server.
            - generic [ref=f59e349]: Before you can use your app in a production capacity, you must create and configure your own webhook endpoint on a public server that can accept and respond to GET and POST requests, and that can validate and capture webhook payloads.
            - generic [ref=f59e352]:
              - heading "TLS/SSL" [level=2] [ref=f59e353]
              - button [ref=f59e354] [cursor=pointer]
            - generic [ref=f59e358]: Your webhook endpoint server must have a valid TLS or SSL digital security certificate, correctly configured and installed. Self-signed certificates are not supported.
            - generic [ref=f59e361]:
              - heading "mTLS" [level=2] [ref=f59e362]
              - button [ref=f59e363] [cursor=pointer]
            - generic [ref=f59e367]:
              - text: Webhooks support mutual TLS (mTLS) for added security. See Graph API’s
              - link "mTLS for webhooks" [ref=f59e368] [cursor=pointer]:
                - /url: /docs/graph-api/webhooks/getting-started#mtls-for-webhooks
              - text: document to learn how to enable and use mTLS.
            - generic [ref=f59e369]: Note that enabling and disabling mTLS is not supported at the WABA or business phone number level. If you have more than one application accessing the platform, enable mTLS for each application.
            - generic [ref=f59e372]:
              - heading "GET requests" [level=2] [ref=f59e373]
              - button [ref=f59e374] [cursor=pointer]
            - generic [ref=f59e378]:
              - text: GET requests are used to verify your webhook endpoint. Anytime you
              - link [ref=f59e379] [cursor=pointer]:
