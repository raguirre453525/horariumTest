            - generic [ref=f11e338]: En este documento, se describen los webhooks y cómo la plataforma de WhatsApp Business los utiliza.
            - generic [ref=f11e339]: Los webhooks son solicitudes HTTP que envían cargas útiles en formato JSON desde los servidores de Meta a un servidor que designes. La plataforma de WhatsApp Business utiliza webhooks para informarle de los mensajes entrantes, el estado de los mensajes salientes, los eventos de llamadas y otra información importante, como cambios en el estado de su cuenta, actualizaciones de la capacidad de mensajes y cambios en las puntuaciones de calidad de la plantilla.
