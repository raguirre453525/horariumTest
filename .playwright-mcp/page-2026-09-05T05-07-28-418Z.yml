              - text: "):"
            - list [ref=f3e315]:
              - listitem [ref=f3e317]:
                - strong [ref=f3e318]: Start the connection.
                - text: Many clients begin the OAuth flow automatically when the server is added. Others require you to click
                - strong [ref=f3e319]: Connect
                - text: or
                - strong [ref=f3e320]: Authenticate
                - text: first. For example, run
                - code [ref=f3e321]: /mcp
                - text: in Claude Code and select
                - strong [ref=f3e322]: Authenticate
                - text: ", or click"
                - strong [ref=f3e323]: Authenticate
                - text: in a desktop client.
              - listitem [ref=f3e325]:
                - strong [ref=f3e326]: Sign in.
                - text: Your browser opens to sign in with your Meta account. If it doesn’t open automatically, copy the link your client prints and open it manually.
              - listitem [ref=f3e328]:
                - strong [ref=f3e329]: Grant access.
                - text: On the consent screen, select the apps you want the server to access.
              - listitem [ref=f3e331]:
