            - generic [ref=f3e303]:
              - text: The Meta Social Technologies MCP server authenticates with your Meta developer account over OAuth, so the same sign-in flow works with every client. You no longer need to add an App ID or App Secret to your client config. To authenticate, connect the server, sign in, and choose which apps to grant access to, as described in
              - link "Sign-in flow" [ref=f3e304] [cursor=pointer]:
                - /url: "#sign-in-flow"
              - text: .
            - generic [ref=f3e307]:
