            - generic [ref=f3e109]: For developers building apps and integrations on the Meta Social Technologies Developer Platform (developers.facebook.com) — the Meta Social Technologies MCP server helps you manage the Meta apps and integrations you build there. It gives your AI agent and IDE assistant a single entry point for that day-to-day work. It enables an agent to read your app configuration, monitor API health, check App Review status, configure webhook subscriptions, look up the API changelog, and search developer documentation.
