            - generic [ref=f76e397]:
              - text: Los negocios deben desarrollar primero un prototipo de producto para poder demostrar su caso de uso con una grabación de video que enviarán para la revisión de apps. Para aprobar la revisión de apps, es importante que pidas solo los permisos que necesita tu app.
