            - generic [ref=e348]: This document describes webhooks and how the WhatsApp Business Platform uses them.
            - generic [ref=e349]: Webhooks are HTTP requests containing JSON payloads that Meta’s servers send to a server of your designation. The WhatsApp Business Platform uses webhooks to inform you of incoming messages, the status of outgoing messages, call events, and other important information, such as changes to your account status, messaging capability upgrades, and changes to your template quality scores.
            - generic [ref=e350]: "For example, this is a webhook describing a message sent from a WhatsApp user to a business:"
            - generic [ref=e351]:
              - generic [ref=e352]: "{ \"object\": \"whatsapp_business_account\", \"entry\": [ { \"id\": \"102290129340398\", \"changes\": [ { \"value\": { \"messaging_product\": \"whatsapp\", \"metadata\": { \"display_phone_number\": \"15550783881\", \"phone_number_id\": \"106540352242922\" }, \"contacts\": [ { \"profile\": { \"name\": \"Sheena Nelson\" }, \"wa_id\": \"16505551234\" } ], \"messages\": [ { \"from\": \"16505551234\", \"id\": \"wamid.HBgLMTY1MDM4Nzk0MzkVAgASGBQzQTRBNjU5OUFFRTAzODEwMTQ0RgA=\", \"timestamp\": \"1749416383\", \"type\": \"text\", \"text\": { \"body\": \"Does it come in another color?\" } } ] }, \"field\": \"messages\" } ] } ] }"
