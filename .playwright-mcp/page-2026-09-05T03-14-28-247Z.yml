          - article [ref=f84e210]:
            - heading "Business Verification" [level=1] [ref=f84e211]
            - generic [ref=f84e212]: "Updated: Jul 7, 2023"
            - generic [ref=f84e216]:
              - button "Copy for LLM" [ref=f84e218] [cursor=pointer]
              - link "View as Markdown" [ref=f84e225] [cursor=pointer]:
                - /url: /documentation/development/release/business-verification.md
            - generic [ref=f84e232]:
              - strong [ref=f84e234]:
                - link "Advanced Access" [ref=f84e235] [cursor=pointer]:
                  - /url: /docs/graph-api/overview/access-levels#advanced-access
                - text: now requires Business Verification.
              - generic [ref=f84e236]:
                - text: As of February 1, 2023, if your app requires advanced level access to permissions, you might need to complete
                - link "Business Verification" [ref=f84e237] [cursor=pointer]:
                  - /url: /documentation/development/release/business-verification
                - text: .
                - link "See this blog post for more information." [ref=f84e238] [cursor=pointer]:
                  - /url: https://developers.facebook.com/blog/post/2023/02/01/developer-platform-requiring-business-verification-for-advanced-access/
            - generic [ref=f84e239]: Business Verification is a process that allows us to gather information about you and your Business so we can verify your identity as a business entity.
            - generic [ref=f84e240]:
              - text: Apps that request
              - link "advanced access" [ref=f84e241] [cursor=pointer]:
                - /url: /docs/graph-api/overview/access-levels#advanced-access
              - text: for permissions and apps that allow other
              - link [ref=f84e242] [cursor=pointer]:
                - /url: https://business.facebook.com/
                - text: Businesses
                - generic [ref=f84e243]:
                  - text: ⁠
                  - img "This link opens in a new tab or window" [ref=f84e244]
              - text: to access their own data must be connected to a Business that has completed Business Verification. Until then, app users from other Businesses will be unable to grant these apps
              - link "permissions" [ref=f84e247] [cursor=pointer]:
                - /url: /docs/permissions/reference
              - text: and all
              - link "features" [ref=f84e248] [cursor=pointer]:
                - /url: /docs/apps/features-reference
              - text: will be inactive.
            - generic [ref=f84e249]:
              - text: If your app will only be used by app users who have a
              - link "role" [ref=f84e250] [cursor=pointer]:
                - /url: /documentation/development/build-and-test/app-roles
              - text: on the app itself you do not need to complete verification; these users can grant your app any permissions at any time and all features are always active.
            - generic [ref=f84e251]: You can use the App Dashboard to connect your app to a Business that you’re an Admin of, regardless of whether or not the Business has been verified, but the verification process itself must be completed in the Facebook Business Manager. If you do not have a Business, you will be given the option to create one.
            - generic [ref=f84e252]: Note that anyone with an Administrator role on your app can connect it to a Business, but only someone with an Admin role in the Business will be able to complete the verification process.
            - generic [ref=f84e255]:
              - 'heading "Step 1: Connect your app to a Business" [level=2] [ref=f84e256]'
              - button [ref=f84e257] [cursor=pointer]
            - generic [ref=f84e261]:
              - text: Load your app in the App Dashboard and go to
              - strong [ref=f84e262]: Settings
              - text: ">"
              - strong [ref=f84e263]: Basic
              - text: ">"
              - strong [ref=f84e264]: Verification
              - text: and click the Start Verification button or the
              - strong [ref=f84e265]: + Business Verification
              - text: link if you have previously completed Individual Verification.
            - img "Verification section in the Basic Settings panel." [ref=f84e267] [cursor=pointer]
            - generic [ref=f84e268]: "If your Facebook developer account is already associated with a Facebook Business account, you will be given the option to select a Business within it:"
            - img "Business selection modal with a verified Business selected." [ref=f84e270] [cursor=pointer]
            - generic [ref=f84e271]: If you don’t have a Facebook Business account, or if your account contains no Businesses, you will be prompted to create one.
            - generic [ref=f84e272]:
              - text: Connecting your app to a verified Business completes the connection process and there’s nothing else you have to do. The
              - strong [ref=f84e273]: Verification
              - text: "section should show that your app is now connected to a verified Business:"
            - img "Verification section showing 'Verified' alongside the name of the Business that has been connected to the app." [ref=f84e275] [cursor=pointer]
            - generic [ref=f84e276]: If, however, you connected your app to an unverified Business, you must complete the verification process in the Business Manager.
            - generic [ref=f84e279]:
              - 'heading "Step 2: Verify your Business" [level=2] [ref=f84e280]'
              - button [ref=f84e281] [cursor=pointer]
            - generic [ref=f84e285]: If you connected your app to an unverified Business, you or Admin of the Business must complete the verification process within the Business Manager.
            - img "Business selection modal with an unverified Business selected." [ref=f84e287] [cursor=pointer]
            - generic [ref=f84e288]: Click Start Business Verification to load the unverified Business in the Business Manager and complete the verification process.
            - generic [ref=f84e289]:
              - text: Refer to our Business Manager Help Center’s
              - link [ref=f84e290] [cursor=pointer]:
                - /url: https://www.facebook.com/business/help/1095661473946872
                - text: About Business Verification
                - generic [ref=f84e291]:
                  - text: ⁠
                  - img "This link opens in a new tab or window" [ref=f84e292]
              - text: topic for an explanation of the process and a list of documents you will need.
            - generic [ref=f84e295]: "Once you have completed verification, return to the Basic Settings panel. You should see that your app is now connected to a verified Business:"
            - img "Verification section showing 'Verified' alongside the name of the Business that has been connected to the app." [ref=f84e297] [cursor=pointer]
