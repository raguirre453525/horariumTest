              - text: de tu app, puedes publicarla. Publicar una app significa hacer que la app esté disponible para las cuentas que no tienen un rol
              - link:
                - /url: /documentation/development/build-and-test/app-roles
              - text: en ella. En este documento, se enumeran los procesos y las opciones de configuración de la app que probablemente se necesiten para poder publicar una app en forma correcta.
