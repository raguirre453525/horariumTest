              - text: Si las personas que usarán tu app no tienen un rol en ella, la app debe completar el proceso de
              - link "revisión de apps" [ref=f46e245] [cursor=pointer]:
                - /url: /docs/app-review
              - text: .
            - generic [ref=f46e246]:
              - text: Este proceso te permite solicitar la aprobación de
              - link "permisos" [ref=f46e247] [cursor=pointer]:
                - /url: /docs/permissions/reference
              - text: "y"
              - link "funciones" [ref=f46e248] [cursor=pointer]:
                - /url: /docs/apps/features-reference
              - text: específicos de la API que tu app necesita para funcionar correctamente. Los usuarios de la app que no tienen un rol en ella pueden otorgar a tu app solo los permisos aprobados mediante el proceso de revisión de apps, y solo las funciones aprobadas estarán activas para esos usuarios.
            - generic [ref=f46e249]: El proceso de revisión de apps requiere que identifiques cada uno de los permisos y las funciones que tu app necesita, describas el motivo por el que los necesita y nos muestres cómo tu app usa los datos devueltos o aceptados por nuestras API.
