              - button [ref=f46e256] [cursor=pointer]
            - generic [ref=f46e260]:
              - text: La verificación del negocio es un proceso que nos permite verificar tu identidad como entidad comercial. Las apps que solicitan acceso avanzado de permisos y las que permiten a otras empresas acceder a sus propios datos deben estar conectadas a una empresa que haya completado el proceso de
              - link "verificación del negocio" [ref=f46e261] [cursor=pointer]:
                - /url: /documentation/development/release/business-verification
              - text: . Hasta entonces, los usuarios de la app de otras empresas no podrán otorgar permisos a estas apps y todas las funciones estarán inactivas.
            - generic [ref=f46e262]:
