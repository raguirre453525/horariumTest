          - article [ref=f83e210]:
            - heading "verificación del negocio" [level=1] [ref=f83e211]
            - generic [ref=f83e212]: "Updated: 7 jul 2023"
            - generic [ref=f83e216]:
              - button "Copiar para LLM" [ref=f83e218] [cursor=pointer]
              - link "Ver como Markdown" [ref=f83e225] [cursor=pointer]:
                - /url: /documentation/development/release/business-verification.md
            - generic [ref=f83e232]:
              - strong [ref=f83e234]:
                - link "Para obtener acceso avanzado" [ref=f83e235] [cursor=pointer]:
                  - /url: /docs/graph-api/overview/access-levels#advanced-access
                - text: ", ahora es necesario verificar el negocio"
              - generic [ref=f83e236]:
                - text: A partir del 1 de febrero de 2023, si tu app necesita acceso de nivel avanzado a permisos, es posible que debas completar la
                - link "verificación del negocio" [ref=f83e237] [cursor=pointer]:
                  - /url: /documentation/development/release/business-verification
                - text: .
                - link "Consulta esta publicación de blog para obtener más información." [ref=f83e238] [cursor=pointer]:
                  - /url: https://developers.facebook.com/blog/post/2023/02/01/developer-platform-requiring-business-verification-for-advanced-access/
            - generic [ref=f83e239]: La verificación del negocio es un proceso que nos permite recopilar información sobre ti y tu empresa. Se usa para verificar tu identidad como entidad comercial.
            - generic [ref=f83e240]:
              - text: Las apps que solicitan
              - link "acceso avanzado" [ref=f83e241] [cursor=pointer]:
                - /url: /docs/graph-api/overview/access-levels#advanced-access
              - text: a permisos y las apps que permiten a otros
              - link [ref=f83e242] [cursor=pointer]:
                - /url: https://business.facebook.com/
                - text: negocios
                - generic [ref=f83e243]:
                  - text: ⁠
                  - img "El enlace se abre en una pestaña o ventana nueva" [ref=f83e244]
              - text: acceder a sus propios datos deben estar conectadas a un negocio que haya completado la verificación del negocio. Hasta entonces, los usuarios de la app de otras empresas no podrán otorgar
              - link "permisos" [ref=f83e247] [cursor=pointer]:
                - /url: /docs/permissions/reference
              - text: a estas apps, y todas las
              - link "funciones" [ref=f83e248] [cursor=pointer]:
                - /url: /docs/apps/features-reference
              - text: estarán inactivas.
            - generic [ref=f83e249]:
              - text: Si solo los usuarios que tienen un
              - link "rol" [ref=f83e250] [cursor=pointer]:
                - /url: /documentation/development/build-and-test/app-roles
              - text: en la propia app son quienes la usan, no es necesario que completes la verificación. Estos usuarios pueden otorgar a tu app cualquier permiso en cualquier momento, y todas las funciones siempre están activas.
            - generic [ref=f83e251]: Puedes usar el panel de aplicaciones para conectar tu aplicación a un negocio del que seas administrador, independientemente de si el negocio ha sido verificado o no, pero el proceso de verificación en sí debe completarse en el administrador comercial de Facebook. Si no tienes una empresa, se te dará la opción de crear una.
            - generic [ref=f83e252]: Ten en cuenta que cualquier persona que tenga rol de administrador en tu app puede conectarla a una empresa, pero solo alguien con rol de administrador en la empresa podrá completar el proceso de verificación.
            - generic [ref=f83e255]:
              - 'heading "Paso 1: Conecta tu app a una empresa" [level=2] [ref=f83e256]'
              - button [ref=f83e257] [cursor=pointer]
            - generic [ref=f83e261]:
              - text: Carga tu app en el Panel de apps, ve a
              - strong [ref=f83e262]: Configuración
              - text: ">"
              - strong [ref=f83e263]: Básica
              - text: ">"
              - strong [ref=f83e264]: Verificación
              - text: y haz clic en el botón "Iniciar verificación" o en el enlace
              - strong [ref=f83e265]: + Verificación del negocio
              - text: si anteriormente completaste la verificación individual.
            - img "Verification section in the Basic Settings panel." [ref=f83e267] [cursor=pointer]
            - generic [ref=f83e268]: "Si tu cuenta de desarrollador de Facebook ya está asociada a una cuenta comercial de Facebook, tendrás la opción de seleccionar una empresa en ella:"
            - img "Business selection modal with a verified Business selected." [ref=f83e270] [cursor=pointer]
            - generic [ref=f83e271]: Si no tienes una cuenta de negocios de Facebook, o si tu cuenta no contiene negocios, se te pedirá que cree una.
            - generic [ref=f83e272]:
              - text: Conectar tu aplicación a un negocio verificado completa el proceso de conexión y no tienes nada más que hacer. La sección
              - strong [ref=f83e273]: Verificación
              - text: "debería mostrar que tu app ahora está conectada a una empresa verificada:"
            - img "Verification section showing 'Verified' alongside the name of the Business that has been connected to the app." [ref=f83e275] [cursor=pointer]
            - generic [ref=f83e276]: Sin embargo, si conectas tu app a una empresa no verificada, debes completar el proceso de verificación en el administrador comercial.
            - generic [ref=f83e279]:
              - 'heading "Paso 2: Verifica tu negocio" [level=2] [ref=f83e280]'
              - button [ref=f83e281] [cursor=pointer]
            - generic [ref=f83e285]: Si conectas tu app a una empresa no verificada, tú o el administrador de la empresa deben completar el proceso de verificación en el administrador comercial.
            - img "Business selection modal with an unverified Business selected." [ref=f83e287] [cursor=pointer]
            - generic [ref=f83e288]: Haz clic en "Iniciar verificación del negocio" para cargar la empresa no verificada en el administrador comercial y completar el proceso de verificación.
            - generic [ref=f83e289]:
              - text: En el tema
              - link [ref=f83e290] [cursor=pointer]:
                - /url: https://www.facebook.com/business/help/1095661473946872
                - text: Información sobre la verificación del negocio
                - generic [ref=f83e291]:
                  - text: ⁠
                  - img "El enlace se abre en una pestaña o ventana nueva" [ref=f83e292]
              - text: del servicio de ayuda del administrador comercial puedes consultar la explicación del proceso y una lista de los documentos que necesitarás.
            - generic [ref=f83e295]: "Cuando hayas completado la verificación, regresa al panel de configuración básica. Debería aparecer que tu app ahora está conectada a una empresa verificada:"
            - img "Verification section showing 'Verified' alongside the name of the Business that has been connected to the app." [ref=f83e297] [cursor=pointer]
