                  - /url: /docs/permissions#whatsapp_business_management
                - text: ": se necesita para acceder a metadatos en tu cuenta de WhatsApp Business, administrar plantillas, obtener números de teléfono de negocios asociados con tu WABA, obtener estadísticas y recibir webhooks que te notifican cambios en tu cuenta de WhatsApp Business."
              - listitem [ref=f9e339]:
                - link "whatsapp_business_messaging" [ref=f9e340] [cursor=pointer]:
                  - /url: /docs/permissions#whatsapp_business_messaging
                - text: ": se necesita para enviar cualquier tipo de mensaje a usuarios de WhatsApp y recibir webhooks de mensajes entrantes y de estado de mensajes."
            - generic [ref=f9e341]: "Según las necesidades de tu negocio, es posible que también necesites estos permisos:"
            - list [ref=f9e342]:
