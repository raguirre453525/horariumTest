            - generic [ref=f110e109]: Para desarrolladores que construyen aplicaciones e integraciones en la plataforma de desarrollo de Tecnología Social de Meta ( developers.facebook.com ) - el servidor Meta Social Technologies MCP te ayuda a administrar las aplicaciones y las integraciones de Meta que construyes allí. Proporciona a tu agente de IA y al asistente del entorno de desarrollo integrado un único punto de entrada para el trabajo diario. Permite que un agente lea la configuración de tu app, supervise el estado de la API, verifique el estado de la revisión de apps, configure suscripciones a Webhooks, busque el registro de cambios de la API y busque documentación para desarrolladores.
