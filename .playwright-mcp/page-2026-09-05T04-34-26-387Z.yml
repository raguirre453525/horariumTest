            - generic [ref=f110e303]:
              - text: El servidor MCP de tecnologías sociales de Meta se autentica con tu cuenta de desarrollador de Meta a través de OAuth, por lo que el mismo proceso de inicio de sesión funciona con todos los clientes. Ya no es necesario agregar el identificador de la app ni la clave secreta de la app a la configuración del cliente. Para autenticarlo, conecta el servidor, inicia sesión y elige las aplicaciones a las que se les concederá acceso, como se describe en
              - link "Proceso de inicio de sesión" [ref=f110e304] [cursor=pointer]:
