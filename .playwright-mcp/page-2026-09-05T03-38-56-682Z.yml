              - listitem [ref=f100e216]:
                - generic [ref=f100e217]: Configuración básica
          - article [ref=f100e220]:
            - heading "Configuración básica" [level=1] [ref=f100e221]
            - generic [ref=f100e222]: "Updated: 18 oct 2023"
            - generic [ref=f100e226]:
              - button "Copiar para LLM" [ref=f100e228] [cursor=pointer]
              - link "Ver como Markdown" [ref=f100e235] [cursor=pointer]:
                - /url: /documentation/development/create-an-app/app-dashboard/basic-settings.md
            - generic [ref=f100e241]: La página de configuración básica te da un lugar para configurar opciones importantes, como el nombre de tus aplicaciones, correo electrónico de contacto y categoría, y encontrar el secreto de la aplicación asignado a tu aplicación por Meta. Necesitas los ajustes que figuran en este documento para crear una app en la plataforma de Meta.
            - generic [ref=f100e244]:
              - heading "Configuración general" [level=2] [ref=f100e245]
              - button [ref=f100e246] [cursor=pointer]
            - generic [ref=f100e250]: La configuración general contiene identificadores únicos que se le asignan a tu app y que te permiten proporcionar información adicional para seguir definiendo y describiendo tu app. Estos identificadores nos permiten identificar a tu app cuando hace llamadas a la API y, a su vez, nos permiten determinar cuáles son los permisos y las funciones que los usuarios de la app le otorgaron a esta. Asimismo, esos identificadores se utilizan para generar tokens de acceso.
            - generic [ref=f100e253]:
              - heading "Identificador de la app" [level=3] [ref=f100e254]
              - button [ref=f100e255] [cursor=pointer]
            - generic [ref=f100e259]: Cuando creas una app de Facebook, generamos y le asignamos un identificador único. Este identificador debe incluirse al momento de hacer llamadas a nuestras API. Puedes configurar fácilmente este valor en el código base desde cualquiera de nuestros SDK, de modo que el identificador se incluya automáticamente en las llamadas a la API.
            - generic [ref=f100e262]:
              - heading "Clave secreta de la app" [level=3] [ref=f100e263]
              - button [ref=f100e264] [cursor=pointer]
            - generic [ref=f100e268]:
              - text: La clave secreta de la app se usa en algunos de los procesos del
              - link "inicio de sesión con Facebook" [ref=f100e269] [cursor=pointer]:
                - /url: /documentation/facebook-login
              - text: para generar un
              - link "token de acceso de app" [ref=f100e270] [cursor=pointer]:
                - /url: /documentation/facebook-login/guides/access-tokens#apptokens
              - text: ", que puede realizar llamadas a la API a pedido de los usuarios de la app. Es sumamente importante guardar la clave secreta de la app en un lugar seguro y no incluirla en ningún código al que pueda acceder cualquier persona que no sea un desarrollador de la app."
            - generic [ref=f100e271]: Recomendamos que los tokens de acceso de la aplicación solo se usen directamente desde los servidores de tu aplicación para proporcionar la mejor seguridad. En el caso de las apps nativas, te sugerimos que la app se comunique con tu propio servidor y que el servidor, luego, haga las solicitudes a la API de Facebook mediante el token de acceso de la app.
            - generic [ref=f100e274]:
              - heading "Restablecer la clave secreta de la app" [level=4] [ref=f100e275]
              - button [ref=f100e276] [cursor=pointer]
            - generic [ref=f100e280]:
              - text: Si la clave secreta de tu app se ve vulnerada, es necesario restablecerla de inmediato en la
              - link "configuración básica del panel de apps" [ref=f100e281] [cursor=pointer]:
                - /url: /apps/
              - text: . No es posible rotar de forma programática la clave secreta de la app.
            - generic [ref=f100e282]: Si Meta descubre que la clave secreta de la app se filtró y los datos de los usuarios están en riesgo, te notificará y te pedirá que restablezcas la clave de inmediato. Si no respondes de manera oportuna, Meta restablecerá la clave secreta de la app. De esta manera, todas las integraciones comerciales dejarán de funcionar, ya que se anularán las concesiones de datos del usuario correspondientes a la app. Se trata de un proceso muy molesto, que solo se ejecutará si los datos de los usuarios están en riesgo y no restableces rápidamente la clave secreta de la app.
            - generic [ref=f100e287]:
              - heading "Nombre visible:" [level=3] [ref=f100e288]
              - button [ref=f100e289] [cursor=pointer]
            - generic [ref=f100e293]:
              - text: El nombre para mostrar es el nombre de tu app que ven los usuarios y se mostrará en el
              - link "centro de apps" [ref=f100e294] [cursor=pointer]:
                - /url: /docs/games/listing
              - text: . Este campo requiere que cambies tu app al modo activo.
            - generic [ref=f100e297]:
              - heading "Normas sobre nombres visibles" [level=4] [ref=f100e298]
              - button [ref=f100e299] [cursor=pointer]
            - generic [ref=f100e303]:
              - text: Sigue estas normas cuando selecciones o modifiques el nombre para mostrar de tu app. De lo contrario, se rechazará durante la
              - link "revisión de apps" [ref=f100e304] [cursor=pointer]:
                - /url: /docs/app-review
              - text: .
            - list [ref=f100e305]:
              - listitem [ref=f100e307]: No utilices nombres que incluyan "Facebook" o "FB" o los nombres de los productos de Facebook como, por ejemplo, Oculus, WhatsApp o Instagram.
              - listitem [ref=f100e309]: No utilice "F", "Libro" o "Face" en su nombre si puede ser percibido como una referencia a Facebook.
              - listitem [ref=f100e311]:
                - text: No utilices
