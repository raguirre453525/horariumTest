                  - text: nuestras marcas
                  - generic [ref=f100e320]:
                    - text: ⁠
                    - img "El enlace se abre en una pestaña o ventana nueva" [ref=f100e321]
                - text: con tu nombre.
              - listitem [ref=f100e325]:
                - text: No utilices nombres o logos que imiten
                - link [ref=f100e326] [cursor=pointer]:
                  - /url: https://l.facebook.com/l.php?u=https%3A%2F%2Fwww.facebookbrand.com%2Ftrademarks&h=AUAgQBhejo5wcoQEiSWQp7KpFniyirXjXtPoexF9dOykCnMV_n8h1QPeIoNAxyjKxfbVuw1CeBcugc_OQe4LxCds0GCqgVsnP0QbAma4GwNp81DZqEDTEPpH8iOVY5r3GVbqy_PhhrQ6mbmWB7Hjlw
                  - text: nuestras marcas
                  - generic [ref=f100e327]:
                    - text: ⁠
                    - img "El enlace se abre en una pestaña o ventana nueva" [ref=f100e328]
                - text: o que puedan generar confusión respecto de estos.
              - listitem [ref=f100e332]: No presentes nuestros activos de marca de una forma tal que se conviertan en la parte más distintiva o destacada de tu app.
            - generic [ref=f100e335]:
              - heading "Espacio de nombres" [level=3] [ref=f100e336]
              - button [ref=f100e337] [cursor=pointer]
            - generic [ref=f100e341]: Los enlaces URL del espacio de nombres a la página de Canvas de tu aplicación. Se utiliza la página principal para informar al usuario sobre tu app.
            - generic [ref=f100e344]:
              - heading "Dominios de la app" [level=3] [ref=f100e345]
              - button [ref=f100e346] [cursor=pointer]
            - generic [ref=f100e350]: Los dominios y subdominios de la app se utilizan durante la solicitud de la API Graph para que se realice la verificación.
            - generic [ref=f100e353]:
              - heading "Correo electrónico de contacto" [level=3] [ref=f100e354]
              - button [ref=f100e355] [cursor=pointer]
            - generic [ref=f100e359]:
              - text: El correo electrónico de contacto es la dirección de correo electrónico donde se enviarán
              - link "notificaciones de desarrollador" [ref=f100e360] [cursor=pointer]:
                - /url: /documentation/development/create-an-app/developer-settings
              - text: . Estas notificaciones también se mostrarán en las alertas del panel de la app. Este campo requiere que cambies tu app al modo activo.
            - generic [ref=f100e363]:
              - heading "URL de la política de privacidad" [level=3] [ref=f100e364]
              - button [ref=f100e365] [cursor=pointer]
            - generic [ref=f100e369]: La URL de la Política de Privacidad enlaza a la política de privacidad de tu aplicación que se aplica a los usuarios de tu aplicación.
            - generic [ref=f100e372]:
              - heading "URL de las Condiciones del servicio" [level=3] [ref=f100e373]
              - button [ref=f100e374] [cursor=pointer]
            - generic [ref=f100e378]: La URL de las Condiciones del servicio dirige a las condiciones del servicio de tu app que se aplican a los usuarios de la app. Este campo requiere que cambies tu app al modo activo.
            - generic [ref=f100e381]:
              - heading "Eliminación de datos de usuarios" [level=3] [ref=f100e382]
              - button [ref=f100e383] [cursor=pointer]
            - generic [ref=f100e387]: La URL de eliminación de datos de usuarios dirige a instrucciones explícitas para los usuarios de la app sobre cómo eliminar sus datos de tu app. Esta URL puede ser la sección relevante de la política de privacidad de la aplicación.
            - generic [ref=f100e388]: La URL de eliminación de datos se llama cuando los usuarios eliminan tu aplicación a través de la página de configuración de aplicaciones y sitios web de Facebook, y luego en la sección Eliminada, haz clic en tu aplicación y solicita que se eliminen sus datos.
            - generic [ref=f100e389]:
              - text: Obtén más información sobre la
              - link "eliminación de datos" [ref=f100e390] [cursor=pointer]:
                - /url: /documentation/development/create-an-app/app-dashboard/data-deletion-callback
              - text: .
            - generic [ref=f100e393]:
              - heading "Ícono de la app" [level=3] [ref=f100e394]
              - button [ref=f100e395] [cursor=pointer]
            - generic [ref=f100e399]: El ícono de la app representa tu app en el centro de apps. Este campo requiere que cambies tu app al modo activo.
            - generic [ref=f100e402]:
              - heading "Normas del ícono de la app" [level=4] [ref=f100e403]
              - button [ref=f100e404] [cursor=pointer]
            - generic [ref=f100e408]:
              - text: Sigue estas normas cuando cargas o reemplazas el ícono de tu app; de no hacerlo, se rechazará durante la
              - link "revisión de apps" [ref=f100e409] [cursor=pointer]:
                - /url: /docs/app-review
              - text: .
            - list [ref=f100e410]:
              - listitem [ref=f100e412]: No uses ni incorpores ninguno de nuestros logotipos, marcas comerciales, íconos ni ninguna forma modificada ni variación de estos. Entre ellos, se incluyen los logotipos, las marcas comerciales y los íconos de alguno de nuestros otros productos, como Facebook, Instagram, Oculus o WhatsApp.
              - listitem [ref=f100e414]: No incluyas "Facebook" o "FB".
            - generic [ref=f100e417]:
              - heading "Categoría" [level=3] [ref=f100e418]
              - button [ref=f100e419] [cursor=pointer]
            - generic [ref=f100e423]:
              - text: La
              - link "categoría" [ref=f100e424] [cursor=pointer]:
                - /url: /documentation/development/create-an-app/app-dashboard/app-categories
              - text: de tu app ayuda a los usuarios a descubrir nuevas apps según la búsqueda que realicen. Este campo requiere que cambies tu app al modo activo.
            - generic [ref=f100e427]:
              - heading "Propósito de la app" [level=3] [ref=f100e428]
              - button [ref=f100e429] [cursor=pointer]
            - generic [ref=f100e433]: El propósito de tu aplicación se utiliza durante la revisión de la aplicación para decirnos cómo tu aplicación accederá y usará tus datos o datos de otras personas. Este campo requiere que cambies tu app al modo activo.
            - generic [ref=f100e436]:
              - heading "verificación del negocio" [level=2] [ref=f100e437]
              - button [ref=f100e438] [cursor=pointer]
            - generic [ref=f100e442]: La verificación del negocio es un proceso que permite que Facebook verifique tu identidad como entidad comercial. Se requiere para acceder a datos que no son de tu propiedad. Si bien la verificación no es necesaria para activar tu app, no podrás acceder a los datos que no te pertenecen hasta que se haya completado la verificación.
            - generic [ref=f100e443]:
              - text: Obtén más información sobre la
              - link "verificación del negocio" [ref=f100e444] [cursor=pointer]:
                - /url: /documentation/development/release/business-verification
              - text: .
            - generic [ref=f100e447]:
              - heading "Estado de verificación" [level=3] [ref=f100e448]
              - button [ref=f100e449] [cursor=pointer]
            - generic [ref=f100e453]: Después de haber presentado una solicitud de verificación, tu estado será "pendiente" y, cuando Meta haya verificado tu información comercial, pasará a "verificado".
            - generic [ref=f100e456]:
              - heading "Información de contacto del delegado de protección de datos" [level=2] [ref=f100e457]
              - button [ref=f100e458] [cursor=pointer]
            - generic [ref=f100e462]: El Reglamento General de Protección de Datos (RGPD) requiere que ciertas empresas que brindan servicios a las personas que se encuentran en la Unión Europea designen y publiquen la información de contacto de un delegado de protección de datos, quien podrá asistir en asuntos relacionados con el procesamiento de información personal. Esta información se pone a disposición en la configuración de tu app o sitio web, para que los usuarios de tu app puedan contactar al delegado de protección de datos si tienen consultas sobre cómo se procesan y usan sus datos.
