            - heading "WhatsApp permissions" [level=1] [ref=f2e323]
            - generic [ref=f2e324]: "Updated: Jul 1, 2026"
            - generic [ref=f2e328]:
              - button "Copy for LLM" [ref=f2e330] [cursor=pointer]
              - link "View as Markdown" [ref=f2e337] [cursor=pointer]:
                - /url: /documentation/business-messaging/whatsapp/permissions.md
            - generic [ref=f2e343]: "Platform endpoints are gated by permissions. References for each endpoint indicate which permissions it requires, but in general, you will need the following:"
            - list [ref=f2e344]:
              - listitem [ref=f2e346]:
                - link "whatsapp_business_management" [ref=f2e347] [cursor=pointer]:
                  - /url: /docs/permissions#whatsapp_business_management
                - text: — needed to access metadata on your WhatsApp Business account, template management, getting business phone numbers associated with your WABA, all analytics, and to receive webhooks notifying you of changes to your WhatsApp Business account
              - listitem [ref=f2e349]:
                - link "whatsapp_business_messaging" [ref=f2e350] [cursor=pointer]:
                  - /url: /docs/permissions#whatsapp_business_messaging
                - text: — needed to send any type of message to WhatsApp users, and to receive incoming message and message status webhooks
            - generic [ref=f2e351]: "Depending on your business needs, you may also need these permissions:"
            - list [ref=f2e352]:
              - listitem [ref=f2e354]:
                - link "business_management" [ref=f2e355] [cursor=pointer]:
                  - /url: /docs/permissions#business_management
                - text: — only needed if you need to programmatically access your business portfolio (programmatic portfolio access is rarely needed, since you can access your portfolio using
                - link [ref=f2e356] [cursor=pointer]:
                  - /url: https://business.facebook.com/
                  - text: Meta Business Suite
                  - generic [ref=f2e357]:
                    - text: ⁠
                    - img "This link opens in a new tab or window" [ref=f2e358]
                - text: ).
              - listitem [ref=f2e362]:
                - link "whatsapp_business_manage_events" [ref=f2e363] [cursor=pointer]:
                  - /url: /docs/permissions#whatsapp_business_manage_events
                - text: — only needed if you are sending marketing templates with
                - link "Marketing Messages API for WhatsApp" [ref=f2e364] [cursor=pointer]:
                  - /url: /documentation/business-messaging/whatsapp/marketing-messages/overview
                - text: ", in conjunction with the"
                - link "Conversions API" [ref=f2e365] [cursor=pointer]:
                  - /url: /documentation/ads-commerce/conversions-api
                - text: ", for event tracking."
              - listitem [ref=f2e367]:
                - link "ads_read" [ref=f2e368] [cursor=pointer]:
                  - /url: /docs/permissions#ads_read
                - text: — only needed if you are using
                - link "Marketing Messages API for WhatsApp" [ref=f2e369] [cursor=pointer]:
                  - /url: /documentation/business-messaging/whatsapp/marketing-messages/overview
                - text: in conjunction with the
                - link "Insights API" [ref=f2e370] [cursor=pointer]:
                  - /url: /documentation/ads-commerce/marketing-api/insights
                - text: to get conversion metrics.
            - generic [ref=f2e373]:
              - heading "App Review" [level=2] [ref=f2e374]
              - button [ref=f2e375] [cursor=pointer]
            - generic [ref=f2e379]:
              - text: If you are a
              - link "partner" [ref=f2e380] [cursor=pointer]:
