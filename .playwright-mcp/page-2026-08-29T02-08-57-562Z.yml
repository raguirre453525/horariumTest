            - generic [ref=f3e1093]:
              - text: Cuando respondiste al mensaje de prueba que enviaste, se abrió lo que se conoce como un
              - link "intervalo de servicio de atención al cliente" [ref=f3e1094] [cursor=pointer]:
                - /url: /documentation/business-messaging/whatsapp/messages/send-messages#customer-service-windows
              - text: . Este intervalo de 24 horas te permite enviar
              - link "mensajes sin plantilla" [ref=f3e1095] [cursor=pointer]:
                - /url: /documentation/business-messaging/whatsapp/messages/send-messages#message-types
              - text: a los usuarios en WhatsApp. Con el intervalo del servicio de atención al cliente abierto, puedes enviarte un mensaje sin plantilla. Para hacerlo, ingresa el identificador de tu número de teléfono de prueba, el token de acceso de usuario del sistema y tu número de teléfono en el siguiente ejemplo de código. Luego, pega el código en tu terminal y ejecútalo.
            - generic [ref=f3e1096]:
              - code [ref=f3e1098]: "curl 'https://graph.facebook.com/v23.0/<TEST_BUSINESS_PHONE_NUMBER_ID>/messages' \\ -H 'Content-Type: application/json' \\ -H 'Authorization: Bearer <SYSTEM_USER_ACCESS_TOKEN>' \\ -d ' { \"messaging_product\": \"whatsapp\", \"recipient_type\": \"individual\", \"to\": \"<WHATSAPP_USER_PHONE_NUMBER>\", \"type\": \"text\", \"text\": { \"body\": \"Hello!\" } }'"
              - button [ref=f3e1099] [cursor=pointer]
