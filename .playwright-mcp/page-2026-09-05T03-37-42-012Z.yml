              - listitem [ref=f98e216]:
                - generic [ref=f98e217]: Expectativas de una política de privacidad
          - article [ref=f98e220]:
            - heading "Expectativas de una política de privacidad" [level=1] [ref=f98e221]
            - generic [ref=f98e222]: "Updated: 3 feb 2025"
            - generic [ref=f98e226]:
              - button "Copiar para LLM" [ref=f98e228] [cursor=pointer]
              - link "Ver como Markdown" [ref=f98e235] [cursor=pointer]:
                - /url: /documentation/development/terms-and-policies/privacy-policy.md
            - generic [ref=f98e241]: En este documento, se detallan las expectativas mínimas en cuanto a lo que debe incluir una política de privacidad. Ten en cuenta que no es una lista exhaustiva de todas las posibles consideraciones que se deben tener en cuenta al momento de crear una política de privacidad. Tu política de privacidad debe revelar de manera detallada y completa todas tus prácticas de privacidad. Además, debe cumplir con las leyes y normativas aplicables, por lo que tal vez debas incluir información adicional o única para tal fin.
            - generic [ref=f98e242]:
              - text: Encuentra más recursos en video de
              - link [ref=f98e243] [cursor=pointer]:
                - /url: https://l.facebook.com/l.php?u=https%3A%2F%2Fapp.dataprotocol.com%2Fchannels%2Fmeta&h=AUBXGnsjKutH1wWx_5Gbbvb22_JzLCcv5ZX4JxXUI7El9g2f4RMoX5pz-9aEtQKieYwtWrOUsaKV-c_Y1CBxYDq6fuzya5mRyS8QVxtEvrsKq5zVZhbPhCD7rvvtYqBD_MhBGTZtRB3rmLiP_79_Jg
                - text: Data Protocol
                - generic [ref=f98e244]:
                  - text: ⁠
                  - img "El enlace se abre en una pestaña o ventana nueva" [ref=f98e245]
              - text: .
            - generic [ref=f98e250]:
              - heading "¿Por qué Meta exige que los desarrolladores tengan una política de privacidad?" [level=2] [ref=f98e251]
              - button [ref=f98e252] [cursor=pointer]
            - generic [ref=f98e256]: La información sobre las prácticas de privacidad ayuda a los usuarios a entender qué datos recopilas, por qué los recopilas y qué haces con ellos. Estas descripciones, por lo general, deben ser exhaustivas, precisas y fáciles de entender para los usuarios.
            - generic [ref=f98e259]:
              - heading "Qué debería incluir una política de privacidad básica" [level=2] [ref=f98e260]
              - button [ref=f98e261] [cursor=pointer]
            - list [ref=f98e265]:
              - listitem [ref=f98e267]:
                - strong [ref=f98e268]: Qué información recopilas
            - generic [ref=f98e269]: Por lo general, la política debe explicar cuál es la información que se recopila del usuario o sobre este, ya sea de manera directa o a través de terceros. Esto incluye la información recopilada automáticamente, como información del navegador, del servidor o de uso; además de la información que obtienes del usuario, ya sea directamente o a través de una API de permisos.
            - list [ref=f98e270]:
              - listitem [ref=f98e272]:
                - strong [ref=f98e273]: Cómo procesas esa información y los motivos por los que la recopilas
            - generic [ref=f98e274]: Tu política de privacidad debe explicar cómo usas la información que recopilas y detallar un propósito claro por el que se procesan los datos de los usuarios. Por ejemplo, podrías usar la información para brindar ciertos servicios a los usuarios, para reconocerlos la próxima vez que usen tu app o para enviarles correos electrónicos promocionales.
            - list [ref=f98e275]:
              - listitem [ref=f98e277]:
                - strong [ref=f98e278]: Cómo puede el usuario solicitar que se borren sus datos
            - generic [ref=f98e279]: Tu política de privacidad debe describir con claridad el procedimiento que deben seguir los usuarios para solicitar la eliminación de sus datos. Puede ser por correo electrónico o mediante un formulario de contacto, que debe estar actualizado y ser válido.
            - strong [ref=f98e281]: "Además de algunos requisitos de contenido, nuestras políticas también requieren que los enlaces a tu política de privacidad estén disponibles de la siguiente manera:"
            - generic [ref=f98e284]:
              - heading [level=2] [ref=f98e285]:
                - 'link "Condiciones de la plataforma de Facebook: 4. Política de privacidad" [ref=f98e286] [cursor=pointer]':
                  - /url: https://developers.facebook.com/terms#privacypolicy
              - button [ref=f98e287] [cursor=pointer]
            - generic [ref=f98e291]:
              - strong [ref=f98e292]: 4.a
              - emphasis [ref=f98e293]: "\"Proporcionarás y mantendrás una política de privacidad que esté disponible por medio de una URL activa, disponible públicamente, de fácil acceso (incluido para nuestros rastreadores) y sin bloqueo geográfico, y cumplirás con ella. Esta URL también debe figurar en el campo de política de privacidad de la configuración del Panel de apps\"."
            - generic [ref=f98e294]: La finalidad de esta política es que los usuarios y el público de tu sitio web tengan acceso a una política de privacidad del sitio. Asegúrate de que tu política de privacidad no esté oculta, que no sea difícil encontrarla ni que esté solo disponible en ciertos países, de modo que los usuarios que estén en determinadas ubicaciones no puedan verla.
            - strong [ref=f98e296]: "Acceso de los rastreadores a las políticas de privacidad y las URL:"
            - generic [ref=f98e297]: En el contexto de nuestras iniciativas constantes para proteger la privacidad de las personas en Facebook, usamos rastreadores para garantizar que las URL estén activas y que las personas que usan apps de terceros puedan acceder a ellas. Por ello, las URL deben estar disponibles públicamente. Actualizamos nuestras políticas para garantizar que los desarrolladores permitan que nuestro rastreador acceda a las URL que se indican en la configuración de las apps. Esto incluye todas las URL que controla el desarrollador, como la URL de la política de privacidad, la URL de conexión y otras URL específicas del producto.
            - list [ref=f98e298]:
              - listitem [ref=f98e300]:
                - text: Todos los desarrolladores deben proporcionar un enlace a la política de privacidad que explique
                - strong [ref=f98e301]: qué datos se recopilan y cómo se usan, cuál es la razón por la que se procesan dichos datos y de qué manera los usuarios pueden solicitar que se eliminen.
              - listitem [ref=f98e303]: La página vinculada debe estar claramente marcada como política de privacidad.
              - listitem [ref=f98e305]: La política de privacidad debe ser la propia y no la de otra empresa.
              - listitem [ref=f98e307]: Asegúrate de que los enlaces a la política de privacidad estén activos, que se pueda hacer clic en ellos, que los rastreadores de Meta puedan acceder a ellos y que no estén bloqueados para determinados países en el panel de la app y en el sitio web.
              - listitem [ref=f98e309]: Que los enlaces de las políticas de privacidad estén rotos se considera una infracción y se exigirá el cumplimiento de esta norma.
              - listitem [ref=f98e311]: Recomendamos usar el depurador de contenido compartido para verificar que la URL sea válida (código de respuesta 200) antes de enviar el cambio.
            - generic [ref=f98e312]: "Para obtener más información, consulta:"
            - list [ref=f98e313]:
              - listitem [ref=f98e315]:
                - link /docs/sharing/webmasters/crawler/ [ref=f98e316] [cursor=pointer]:
                  - /url: /documentation/sharing/webmasters/web-crawlers
              - listitem [ref=f98e318]:
                - link "https://developers.facebook.com/blog/post/2020/11/10/introducing-graph-v9-marketing-api-v9/" [ref=f98e319] [cursor=pointer]:
                  - /url: /blog/post/2020/11/10/introducing-graph-v9-marketing-api-v9/
            - generic [ref=f98e320]: Para actualizar la URL de la Política de privacidad, ve al panel de apps y actualiza la URL en la configuración.
