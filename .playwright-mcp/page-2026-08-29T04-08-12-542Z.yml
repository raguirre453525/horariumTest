                    - text: . Since both requests use HTTPs, your server must have a valid TLS or SSL certificate correctly configured and installed. Self-signed certificates are not supported.
                  - paragraph [ref=e143]:
                    - text: The sections below explain what will be in each type of request and how to respond to them. Alternatively, you can use our
                    - link "sample app" [ref=e144] [cursor=pointer]:
