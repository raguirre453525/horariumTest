              - generic [ref=e335]:
                - heading "mTLS for Webhooks" [level=2] [ref=e336]
                - paragraph [ref=e337]: Mutual TLS (mTLS) is a method for mutual authentication.
                - paragraph [ref=e338]: mTLS ensures that the parties at each end of a network connection are who they claim to be by verifying that they both have the correct private key. The information within their respective TLS certificates provides additional verification.
                - heading "How to configure mTLS" [level=3] [ref=e339]
                - paragraph [ref=e340]: Once you enable mTLS on your subscription to WhatsApp Business Account, Meta will present a client certificate together with its signing intermediate certificate. Both certificates are used to create a TLS handshake of Webhook requests to your server. Your server then can verify the sender’s identity of these requests by the trust chain and the common name (CN).
                - paragraph [ref=e341]: The client certificate is signed by a Meta-owned Certificate Authority (CA). Configure your server or load balancer to trust the Meta outbound API CA certificate (meta-outbound-api-ca-2025-12.pem). This certificate replaces the previous DigiCert-signed certificate, which expired on April 15, 2026.
                - heading "Client Certificate Verification" [level=3] [ref=e342]
                - paragraph [ref=e343]:
                  - text: After setting up HTTPS for receiving Webhook requests, complete the following steps to verify the client certificate and its common name
                  - code [ref=e344]: client.webhooks.fbclientcerts.com
                  - text: ":"
                - list [ref=e345]:
                  - listitem [ref=e346]: Install the Meta outbound API CA certificate
                  - listitem [ref=e347]: Verify the client certificate against the CA certificate
                  - listitem [ref=e348]: Verify the common name (client.webhooks.fbclientcerts.com) of the client certificate
                - paragraph [ref=e349]: "Note: Servers receiving Webhooks must be using HTTPS; and we are always verifying the certificate from your HTTPS server for security."
                - heading "Example" [level=3] [ref=e350]
                - paragraph [ref=e351]: Depending on your server’s setup, the above steps vary in details. We illustrate by two examples, one for Nginx and one for AWS Application Load Balancer (ALB).
                - heading "Nginx" [level=3] [ref=e352]
                - list [ref=e353]:
                  - listitem [ref=e354]:
                    - paragraph [ref=e355]:
                      - text: Download the Meta outbound API CA certificate (meta-outbound-api-ca-2025-12.pem) to your server, for example to
                      - code [ref=e356]: /etc/ssl/certs/meta-outbound-api-ca-2025-12.pem
                  - listitem [ref=e357]:
                    - paragraph [ref=e358]: Turn on mTLS by Nginx directives
                    - code [ref=e360]: ssl_verify_client on; ssl_client_certificate /etc/ssl/certs/meta-outbound-api-ca-2025-12.pem; ssl_verify_depth 3;
                  - listitem [ref=e361]:
                    - paragraph [ref=e362]:
                      - text: Verify the CN from Nginx embedded variable
                      - code [ref=e363]: $ssl_client_s_dn
                      - text: equals
                      - code [ref=e364]: "\"client.webhooks.fbclientcerts.com\""
                      - text: (
                    - code [ref=e366]: "if ($ssl_client_s_dn ~ \"CN=client.webhooks.fbclientcerts.com\") { return 200 \"$ssl_client_s_dn\"; }"
                - heading "AWS Application Load Balancer (ALB)" [level=3] [ref=e367]
                - list [ref=e368]:
                  - listitem [ref=e369]: Download the Meta outbound API CA certificate (meta-outbound-api-ca-2025-12.pem) to an S3 bucket.
                  - listitem [ref=e370]: Configure the HTTPS listener on the ALB to enable mTLS with the trust store containing the Meta CA certificate in the S3 bucket.
                  - listitem [ref=e371]:
                    - text: In your application code, extract the CN from the HTTP header
                    - link "\"X-Amzn-Mtls-Clientcert-Subject\"" [ref=e372] [cursor=pointer]:
                      - /url: https://l.facebook.com/l.php?u=https%3A%2F%2Fdocs.aws.amazon.com%2Felasticloadbalancing%2Flatest%2Fapplication%2Fmutual-authentication.html&h=AUB0sPMPuFLiJks2l2PxtAYxDeddkzV1RPqREQzwDQHdVjiCdh8G8FwFtBME5fMbIs37DfiksoiEXshUnXiKD-KLGbLP5gK0aPurNoRJ9kEMwBgOomX-oAFwokJ6xOfws0p2QKlLkgfhuuCDA3CpJA
                    - text: ", and verify it equals"
                    - code [ref=e373]: "\"client.webhooks.fbclientcerts.com\""
                    - text: .
                - heading "Downloadable CA certificate" [level=3] [ref=e374]
                - link "meta-outbound-api-ca-2025-12.pem" [ref=e375] [cursor=pointer]:
                  - /url: https://scontent.ftuc4-2.fna.fbcdn.net/v/t39.2365-6/616047706_1570847757511995_2892285379725429023_n.zip?_nc_cat=107&ccb=1-7&_nc_sid=e280be&_nc_ohc=3XmwAweuwJUQ7kNvwHtzuuO&_nc_oc=Adre01XQevdcIKNP6PMcwCSqX7sdg_CG8UvoiLhWuci3VTKPJ5RjdIopNh6KY1r76Hg&_nc_zt=14&_nc_ht=scontent.ftuc4-2.fna&_nc_gid=ayZ93MD2a3zGOZTgnBr0jw&_nc_ss=7a289&oh=00_AQLjUnVECDoUqrLXTWznRTnDbd_lSihVD4tcr1BWA7nmjw&oe=6AACA465
