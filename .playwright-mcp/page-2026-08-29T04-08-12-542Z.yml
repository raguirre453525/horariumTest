                    - listitem [ref=e309]:
                      - text: Compare your signature to the signature in the
                      - code [ref=e310]: X-Hub-Signature-256
                      - text: header (everything after
                      - code [ref=e311]: sha256=
                      - text: ). If the signatures match, the payload is genuine.
                  - heading "Responding to Event Notifications" [level=4] [ref=e313]
                  - paragraph [ref=e315]:
                    - text: Your endpoint should respond to all Event Notifications with
                    - code [ref=e316]: 200 OK HTTPS
                    - text: .
                  - heading "Frequency" [level=4] [ref=e317]
                  - paragraph [ref=e319]:
                    - text: Event Notifications are aggregated and sent in a batch with a
                    - strong [ref=e320]: maximum
                    - text: of 1000 updates. However batching cannot be guaranteed so be sure to adjust your servers to handle each Webhook individually.
                  - paragraph [ref=e321]: If any update sent to your server fails, we will retry immediately, then try a few more times with decreasing frequency over the next 36 hours. Your server should handle deduplication in these cases. Unacknowledged responses will be dropped after 36 hours.
