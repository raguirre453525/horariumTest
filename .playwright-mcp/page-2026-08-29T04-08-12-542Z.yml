                - heading "Notificaciones de eventos" [level=3] [ref=e206]
                - generic [ref=e208]:
                  - paragraph [ref=e209]:
                    - text: When you configure your Webhooks product, you will subscribe to specific
                    - code [ref=e210]: fields
